<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browser</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #0f0f11; color: #e1e1e6; overflow: hidden; }
    #app { display: flex; flex-direction: column; height: 100vh; }
    
    #tab-bar { display: flex; align-items: center; background: #18181c; padding: 6px 6px 0 6px; gap: 4px; border-bottom: 1px solid #27272a; }
    .tab { display: flex; align-items: center; gap: 8px; background: #232328; padding: 8px 12px; border-radius: 8px 8px 0 0; font-size: 12px; max-width: 180px; width: 100%; cursor: pointer; user-select: none; border: 1px solid transparent; border-bottom: none; color: #a1a1aa; }
    .tab.active { background: #0f0f11; color: #fff; border-color: #27272a; }
    .tab-title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tab-close { width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; cursor: pointer; }
    .tab-close:hover { background: #3f3f46; color: #fff; }
    #add-tab-btn { background: transparent; border: none; color: #a1a1aa; width: 28px; height: 28px; border-radius: 6px; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; }
    #add-tab-btn:hover { background: #27272a; color: #fff; }

    #nav-bar { display: flex; align-items: center; background: #0f0f11; padding: 8px 12px; gap: 8px; border-bottom: 1px solid #27272a; }
    .nav-btn { background: transparent; border: none; color: #a1a1aa; width: 32px; height: 32px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .nav-btn:hover { background: #27272a; color: #fff; }
    #url-bar { flex: 1; display: flex; align-items: center; background: #18181c; border: 1px solid #27272a; border-radius: 8px; padding: 0 12px; height: 36px; }
    #url-bar:focus-within { border-color: #3b82f6; }
    #url-input { width: 100%; background: transparent; border: none; outline: none; color: #fff; font-size: 13px; }

    #content-area { flex: 1; position: relative; background: #000; }
    .frame-wrapper { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; }
    .frame-wrapper.active { display: block; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

  <div id="app">
    <div id="tab-bar">
      <div id="tabs-container" style="display: flex; gap: 4px; flex: 1;"></div>
      <button id="add-tab-btn" onclick="createTab()">+</button>
    </div>

    <div id="nav-bar">
      <button class="nav-btn" onclick="reloadTab()">↻</button>
      <div id="url-bar">
        <input type="text" id="url-input" placeholder="Search Google or enter a URL">
      </div>
    </div>

    <div id="content-area"></div>
  </div>

  <script>
    const WORKER_URL = "https://sandbox-browser-proxy.the-troy-place.workers.dev";

    let tabs = [];
    let activeTabId = null;

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js', { scope: '/' })
        .catch(err => console.error('Service Worker registration failed:', err));
    }

    function formatProxyUrl(rawInput) {
      if (!rawInput) return 'about:blank';
      let target = rawInput.trim();
      
      if (!target.startsWith('http://') && !target.startsWith('https://')) {
        if (target.includes('.') && !target.includes(' ')) {
          target = 'https://' + target;
        } else {
          target = 'https://www.google.com/search?q=' + encodeURIComponent(target);
        }
      }
      return WORKER_URL + '/proxy?url=' + encodeURIComponent(target);
    }

    function createTab(initialUrl = '') {
      const tabId = 'tab-' + Date.now();
      const tabObj = { id: tabId, url: initialUrl, title: 'New Tab' };
      tabs.push(tabObj);

      const tabEl = document.createElement('div');
      tabEl.className = 'tab';
      tabEl.id = 'tab-btn-' + tabId;
      tabEl.onclick = () => switchTab(tabId);
      tabEl.innerHTML = `
        <span class="tab-title" id="tab-title-${tabId}">New Tab</span>
        <span class="tab-close" onclick="event.stopPropagation(); closeTab('${tabId}')">✕</span>
      `;
      document.getElementById('tabs-container').appendChild(tabEl);

      const frameWrapper = document.createElement('div');
      frameWrapper.className = 'frame-wrapper';
      frameWrapper.id = 'wrapper-' + tabId;
      
      const iframe = document.createElement('iframe');
      iframe.id = 'frame-' + tabId;
      iframe.setAttribute('allow', 'fullscreen; pointer-lock; autoplay; camera; microphone');
      
      if (initialUrl) {
        iframe.src = formatProxyUrl(initialUrl);
      }

      frameWrapper.appendChild(iframe);
      document.getElementById('content-area').appendChild(frameWrapper);

      switchTab(tabId);
    }

    function switchTab(tabId) {
      activeTabId = tabId;
      document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.frame-wrapper').forEach(el => el.classList.remove('active'));

      const activeTab = document.getElementById('tab-btn-' + tabId);
      const activeWrapper = document.getElementById('wrapper-' + tabId);
      
      if (activeTab) activeTab.classList.add('active');
      if (activeWrapper) activeWrapper.classList.add('active');

      const currentTabObj = tabs.find(t => t.id === tabId);
      document.getElementById('url-input').value = currentTabObj ? currentTabObj.url : '';
    }

    function closeTab(tabId) {
      tabs = tabs.filter(t => t.id !== tabId);
      const tabEl = document.getElementById('tab-btn-' + tabId);
      const wrapperEl = document.getElementById('wrapper-' + tabId);
      
      if (tabEl) tabEl.remove();
      if (wrapperEl) wrapperEl.remove();

      if (activeTabId === tabId && tabs.length > 0) {
        switchTab(tabs[tabs.length - 1].id);
      } else if (tabs.length === 0) {
        createTab();
      }
    }

    function reloadTab() {
      if (!activeTabId) return;
      const iframe = document.getElementById('frame-' + activeTabId);
      if (iframe) iframe.src = iframe.src;
    }

    document.getElementById('url-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const val = e.target.value;
        if (!activeTabId) createTab(val);
        else {
          const tabObj = tabs.find(t => t.id === activeTabId);
          if (tabObj) tabObj.url = val;
          const iframe = document.getElementById('frame-' + activeTabId);
          if (iframe) iframe.src = formatProxyUrl(val);
        }
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      const path = window.location.pathname;
      if (path !== '/' && path !== '/index.html') {
        const fallbackTarget = 'https://www.youtube.com' + path + window.location.search;
        createTab(fallbackTarget);
      } else {
        createTab('https://www.google.com');
      }
    });
  </script>

</body>
</html>
