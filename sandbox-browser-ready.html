<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sandbox Browser</title>
<style>
  :root {
    --chrome-bg: #23252b;
    --chrome-bg-2: #2c2f37;
    --border: #3a3d46;
    --text: #e8e9ec;
    --text-dim: #9a9da6;
    --accent: #4f8cff;
    --danger: #ff6b6b;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: transparent; }

  .sandbox-browser {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 640px;
    max-height: 90vh;
    background: var(--chrome-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 8px 30px rgba(0,0,0,0.25);
  }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    background: var(--chrome-bg);
    border-bottom: 1px solid var(--border);
  }

  .nav-btn {
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--chrome-bg-2);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text);
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.15s ease, opacity 0.15s ease;
  }
  .nav-btn:hover:not(:disabled) { background: #383c46; }
  .nav-btn:disabled { opacity: 0.35; cursor: default; }
  .nav-btn svg { width: 16px; height: 16px; }

  .url-form { flex: 1; display: flex; }

  .url-bar-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--chrome-bg-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0 12px;
    height: 32px;
  }
  .url-bar-wrap:focus-within { border-color: var(--accent); }

  .lock-icon { width: 13px; height: 13px; color: var(--text-dim); flex-shrink: 0; }

  .url-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 13px;
    min-width: 0;
  }
  .url-input::placeholder { color: var(--text-dim); }

  .go-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    display: flex;
    align-items: center;
    padding: 2px;
    flex-shrink: 0;
  }
  .go-btn:hover { color: var(--text); }

  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--text-dim);
    flex-shrink: 0;
    transition: background 0.2s ease;
  }
  .status-dot.loading { background: var(--accent); animation: pulse 0.9s ease-in-out infinite; }
  .status-dot.error { background: var(--danger); }

  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

  .viewport { position: relative; flex: 1; background: #16171b; }
  .viewport iframe { width: 100%; height: 100%; border: none; background: #fff; display: block; }

  .placeholder, .blocked-msg {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px;
    color: var(--text-dim);
    gap: 10px;
  }
  .placeholder svg, .blocked-msg svg { width: 40px; height: 40px; opacity: 0.5; margin-bottom: 6px; }
  .placeholder p, .blocked-msg p { margin: 0; font-size: 13px; line-height: 1.5; max-width: 380px; }
  .blocked-msg .site-name { color: var(--text); font-weight: 600; }

  .open-external {
    margin-top: 8px;
    font-size: 12.5px;
    color: var(--accent);
    text-decoration: none;
    border: 1px solid var(--border);
    padding: 6px 14px;
    border-radius: 999px;
  }
  .open-external:hover { border-color: var(--accent); }

  .footer-note {
    padding: 6px 14px;
    font-size: 11px;
    color: var(--text-dim);
    background: var(--chrome-bg);
    border-top: 1px solid var(--border);
  }
  .footer-note code {
    background: var(--chrome-bg-2);
    padding: 1px 5px;
    border-radius: 4px;
  }
</style>
</head>
<body>

<div class="sandbox-browser">
  <div class="toolbar">
    <button class="nav-btn" id="backBtn" title="Back" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button class="nav-btn" id="forwardBtn" title="Forward" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>
    <button class="nav-btn" id="reloadBtn" title="Reload">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
    </button>

    <form class="url-form" id="urlForm">
      <div class="url-bar-wrap">
        <svg class="lock-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input class="url-input" id="urlInput" type="text" placeholder="Enter a URL, e.g. example.com" autocomplete="off" spellcheck="false">
        <span class="status-dot" id="statusDot"></span>
        <button class="go-btn" type="submit" title="Go">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </div>
    </form>
  </div>

  <div class="viewport" id="viewport">
    <div class="placeholder" id="placeholder">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20z"/></svg>
      <p>Sandboxed view, isolated from the rest of the page. Type a URL above to load a site inside it.</p>
    </div>
  </div>

  <div class="footer-note">Pages load through your proxy at <code id="proxyOriginLabel"></code> — set <code>PROXY_ORIGIN</code> in the script below.</div>
</div>

<script>
(function () {
  // ---- SET THIS to your deployed Cloudflare Worker URL (no trailing slash) ----
  // e.g. 'https://sandbox-browser-proxy.yourname.workers.dev'
  const PROXY_ORIGIN = 'https://sandbox-browser-proxy.the-troy-place.workers.dev';
  // -------------------------------------------------------------------------

  const viewport = document.getElementById('viewport');
  const urlForm = document.getElementById('urlForm');
  const urlInput = document.getElementById('urlInput');
  const backBtn = document.getElementById('backBtn');
  const forwardBtn = document.getElementById('forwardBtn');
  const reloadBtn = document.getElementById('reloadBtn');
  const statusDot = document.getElementById('statusDot');
  const proxyOriginLabel = document.getElementById('proxyOriginLabel');
  proxyOriginLabel.textContent = PROXY_ORIGIN;

  let history = [];
  let historyIndex = -1;
  let currentToken = 0;

  function normalizeUrl(raw) {
    let v = raw.trim();
    if (!v) return null;
    if (!/^https?:\/\//i.test(v)) v = 'https://' + v;
    try { new URL(v); return v; } catch (e) { return null; }
  }

  function siteLabel(url) {
    try { return new URL(url).hostname; } catch (e) { return url; }
  }

  function updateNavButtons() {
    backBtn.disabled = historyIndex <= 0;
    forwardBtn.disabled = historyIndex >= history.length - 1;
  }

  function setStatus(state) {
    statusDot.className = 'status-dot' + (state ? ' ' + state : '');
  }

  function showErrorMessage(url, reason) {
    viewport.innerHTML = '';
    const msg = document.createElement('div');
    msg.className = 'blocked-msg';
    msg.innerHTML =
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="4.9" y1="4.9" x2="19.1" y2="19.1"/></svg>' +
      '<p><span class="site-name">' + siteLabel(url) + '</span> could not be loaded through the proxy.' +
      (reason ? ' (' + reason + ')' : '') + '</p>' +
      '<a class="open-external" href="' + url + '" target="_blank" rel="noopener noreferrer">Open in a new tab instead</a>';
    viewport.appendChild(msg);
    setStatus('error');
  }

  function proxiedUrl(url) {
    return PROXY_ORIGIN + '/proxy?url=' + encodeURIComponent(url);
  }

  function loadUrl(url, opts) {
    opts = opts || {};
    const token = ++currentToken;
    setStatus('loading');
    urlInput.value = url;

    if (PROXY_ORIGIN.includes('YOUR-SUBDOMAIN')) {
      showErrorMessage(url, 'PROXY_ORIGIN is not configured yet — set it at the top of the script');
      return;
    }

    viewport.innerHTML = '';
    const iframe = document.createElement('iframe');
    // allow-same-origin is safe here: the proxy serves everything from ITS
    // own origin (your workers.dev domain), which is still cross-origin
    // relative to the page embedding this widget, so it still can't reach
    // into your site's DOM.
    iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-popups');
    iframe.referrerPolicy = 'no-referrer';
    iframe.src = proxiedUrl(url);

    iframe.addEventListener('load', function () {
      if (token !== currentToken) return;
      setStatus('');
    });
    iframe.addEventListener('error', function () {
      if (token !== currentToken) return;
      showErrorMessage(url, 'network error');
    });

    viewport.appendChild(iframe);

    if (!opts.fromHistory) {
      history = history.slice(0, historyIndex + 1);
      history.push(url);
      historyIndex = history.length - 1;
    }
    updateNavButtons();
  }

  urlForm.addEventListener('submit', function (e) {
    e.preventDefault();
    const url = normalizeUrl(urlInput.value);
    if (!url) return;
    loadUrl(url);
  });

  backBtn.addEventListener('click', function () {
    if (historyIndex > 0) { historyIndex--; loadUrl(history[historyIndex], { fromHistory: true }); }
  });
  forwardBtn.addEventListener('click', function () {
    if (historyIndex < history.length - 1) { historyIndex++; loadUrl(history[historyIndex], { fromHistory: true }); }
  });
  reloadBtn.addEventListener('click', function () {
    if (history[historyIndex]) loadUrl(history[historyIndex], { fromHistory: true });
  });
})();
</script>

</body>
</html>
