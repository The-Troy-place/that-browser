<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sandbox Browser</title>

<style>
:root {
  --chrome-bg: #23252b;
  --chrome-bg-2: #2c2f37;
  --chrome-bg-3: #16171b;
  --border: #3a3d46;
  --text: #e8e9ec;
  --text-dim: #9a9da6;
  --accent: #4f8cff;
  --danger: #ff6b6b;
  --success: #5bd68a;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Helvetica,
    Arial,
    sans-serif;
}

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  background: transparent;
  overflow: hidden;
}

body {
  display: flex;
}

button,
input {
  font: inherit;
}

.sandbox-browser {
  display: flex;
  flex-direction: column;

  width: 100%;
  height: 100vh;
  min-height: 400px;

  background: var(--chrome-bg);
  border: 1px solid var(--border);
  border-radius: 12px;

  overflow: hidden;

  box-shadow:
    0 8px 30px rgba(0, 0, 0, 0.25);

  transition:
    border-radius 0.2s ease,
    box-shadow 0.2s ease;
}

/* Fullscreen */

.sandbox-browser:fullscreen {
  width: 100vw;
  height: 100vh;

  border: 0;
  border-radius: 0;

  box-shadow: none;
}

/* --------------------------------------------------
   TABS
-------------------------------------------------- */

.tab-strip {
  display: flex;
  align-items: flex-end;

  gap: 4px;

  min-height: 38px;

  padding:
    5px
    8px
    0;

  background: var(--chrome-bg);

  border-bottom:
    1px solid
    var(--border);

  overflow-x: auto;
  overflow-y: hidden;

  scrollbar-width: thin;
}

.tab-strip::-webkit-scrollbar {
  height: 4px;
}

.tab-strip::-webkit-scrollbar-thumb {
  background: var(--border);
  border-radius: 20px;
}

.tab {
  display: flex;
  align-items: center;

  gap: 8px;

  min-width: 120px;
  max-width: 240px;

  height: 33px;

  padding:
    0
    10px;

  border:
    1px solid
    var(--border);

  border-bottom: none;

  border-radius:
    8px
    8px
    0
    0;

  background: var(--chrome-bg-2);

  color: var(--text-dim);

  cursor: pointer;

  user-select: none;

  flex: 0 0 auto;
}

.tab.active {
  background: var(--chrome-bg-3);
  color: var(--text);
}

.tab-title {
  flex: 1;

  min-width: 0;

  overflow: hidden;

  text-overflow: ellipsis;

  white-space: nowrap;

  font-size: 12px;
}

.tab-close {
  width: 20px;
  height: 20px;

  border: 0;

  background: transparent;

  color: var(--text-dim);

  cursor: pointer;

  border-radius: 4px;

  font-size: 16px;

  line-height: 1;
}

.tab-close:hover {
  background: rgba(255,255,255,0.08);
  color: var(--text);
}

.new-tab {
  width: 30px;
  height: 30px;

  margin-bottom: 2px;

  border:
    1px solid
    var(--border);

  border-radius: 7px;

  background: var(--chrome-bg-2);

  color: var(--text);

  cursor: pointer;

  flex: 0 0 auto;

  font-size: 18px;
}

.new-tab:hover {
  background: #383c46;
}

/* --------------------------------------------------
   TOOLBAR
-------------------------------------------------- */

.toolbar {
  display: flex;
  align-items: center;

  gap: 8px;

  padding:
    10px
    12px;

  background: var(--chrome-bg);

  border-bottom:
    1px solid
    var(--border);
}

.nav-btn,
.fullscreen-btn {
  width: 32px;
  height: 32px;

  display: flex;

  align-items: center;
  justify-content: center;

  flex-shrink: 0;

  background: var(--chrome-bg-2);

  border:
    1px solid
    var(--border);

  border-radius: 7px;

  color: var(--text);

  cursor: pointer;

  transition:
    background 0.15s ease,
    opacity 0.15s ease;
}

.nav-btn:hover:not(:disabled),
.fullscreen-btn:hover {
  background: #383c46;
}

.nav-btn:disabled {
  opacity: 0.35;
  cursor: default;
}

.nav-btn svg {
  width: 16px;
  height: 16px;
}

/* --------------------------------------------------
   URL BAR
-------------------------------------------------- */

.url-form {
  flex: 1;

  display: flex;

  min-width: 0;
}

.url-bar-wrap {
  flex: 1;

  min-width: 0;

  display: flex;

  align-items: center;

  gap: 8px;

  height: 32px;

  padding:
    0
    12px;

  background: var(--chrome-bg-2);

  border:
    1px solid
    var(--border);

  border-radius: 999px;
}

.url-bar-wrap:focus-within {
  border-color: var(--accent);
}

.lock-icon {
  width: 13px;
  height: 13px;

  color: var(--text-dim);

  flex-shrink: 0;
}

.url-input {
  flex: 1;

  min-width: 0;

  background: transparent;

  border: none;

  outline: none;

  color: var(--text);

  font-size: 13px;
}

.url-input::placeholder {
  color: var(--text-dim);
}

.go-btn {
  background: none;

  border: none;

  color: var(--text-dim);

  cursor: pointer;

  display: flex;

  align-items: center;

  padding: 2px;

  flex-shrink: 0;
}

.go-btn:hover {
  color: var(--text);
}

/* --------------------------------------------------
   STATUS
-------------------------------------------------- */

.status-dot {
  width: 7px;
  height: 7px;

  border-radius: 50%;

  background: var(--text-dim);

  flex-shrink: 0;
}

.status-dot.loading {
  background: var(--accent);

  animation:
    pulse 0.9s
    ease-in-out
    infinite;
}

.status-dot.error {
  background: var(--danger);
}

.status-dot.success {
  background: var(--success);
}

@keyframes pulse {
  0%,
  100% {
    opacity: 1;
  }

  50% {
    opacity: 0.35;
  }
}

/* --------------------------------------------------
   VIEWPORT
-------------------------------------------------- */

.viewport {
  position: relative;

  flex: 1;

  min-height: 0;

  background: #16171b;

  overflow: hidden;
}

.viewport iframe {
  width: 100%;
  height: 100%;

  border: none;

  display: block;

  background: #fff;

  color-scheme: normal;
}

/*
  Permissions important for:
  - YouTube
  - HTML5 video
  - WebGL games
  - gamepads
  - fullscreen
  - encrypted media
  - camera/microphone capable sites
*/

.viewport iframe {
  touch-action: auto;
}

/* --------------------------------------------------
   PLACEHOLDER / ERROR
-------------------------------------------------- */

.placeholder,
.blocked-msg,
.loading-msg {
  position: absolute;

  inset: 0;

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  text-align: center;

  padding: 32px;

  color: var(--text-dim);

  gap: 10px;

  z-index: 2;
}

.placeholder svg,
.blocked-msg svg {
  width: 40px;
  height: 40px;

  opacity: 0.5;

  margin-bottom: 6px;
}

.placeholder p,
.blocked-msg p,
.loading-msg p {
  margin: 0;

  font-size: 13px;

  line-height: 1.5;

  max-width: 500px;
}

.blocked-msg .site-name {
  color: var(--text);

  font-weight: 600;
}

.open-external {
  margin-top: 8px;

  font-size: 12.5px;

  color: var(--accent);

  text-decoration: none;

  border:
    1px solid
    var(--border);

  padding:
    6px
    14px;

  border-radius: 999px;
}

.open-external:hover {
  border-color: var(--accent);
}

/* --------------------------------------------------
   FOOTER
-------------------------------------------------- */

.footer-note {
  display: none;
}

/* --------------------------------------------------
   MOBILE
-------------------------------------------------- */

@media (max-width: 600px) {

  .sandbox-browser {
    border-radius: 0;
    border-left: 0;
    border-right: 0;
  }

  .toolbar {
    padding:
      7px
      8px;

    gap: 5px;
  }

  .nav-btn,
  .fullscreen-btn {
    width: 30px;
    height: 30px;
  }

  .url-bar-wrap {
    padding:
      0
      9px;
  }

  .tab {
    min-width: 100px;
  }
}
</style>
</head>

<body>

<div class="sandbox-browser" id="sandboxBrowser">

  <!-- =========================
       TABS
  ========================== -->

  <div class="tab-strip" id="tabStrip">

    <button
      class="new-tab"
      id="newTabBtn"
      title="New tab"
      type="button"
    >
      +
    </button>

  </div>

  <!-- =========================
       TOOLBAR
  ========================== -->

  <div class="toolbar">

    <button
      class="nav-btn"
      id="backBtn"
      title="Back"
      type="button"
      disabled
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </button>

    <button
      class="nav-btn"
      id="forwardBtn"
      title="Forward"
      type="button"
      disabled
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M9 18l6-6-6-6"/>
      </svg>
    </button>

    <button
      class="nav-btn"
      id="reloadBtn"
      title="Reload"
      type="button"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M23 4v6h-6"/>
        <path d="M1 20v-6h6"/>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/>
        <path d="M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
      </svg>
    </button>

    <form
      class="url-form"
      id="urlForm"
    >

      <div class="url-bar-wrap">

        <svg
          class="lock-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect
            x="3"
            y="11"
            width="18"
            height="11"
            rx="2"
          />

          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>

        <input
          class="url-input"
          id="urlInput"
          type="text"
          placeholder="Enter a URL, e.g. youtube.com"
          autocomplete="off"
          spellcheck="false"
        >

        <span
          class="status-dot"
          id="statusDot"
        ></span>

        <button
          class="go-btn"
          type="submit"
          title="Go"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M5 12h14"/>
            <path d="M13 6l6 6-6 6"/>
          </svg>
        </button>

      </div>

    </form>

    <button
      class="fullscreen-btn"
      id="fullscreenBtn"
      title="Fullscreen"
      type="button"
    >
      ⛶
    </button>

  </div>

  <!-- =========================
       VIEWPORT
  ========================== -->

  <div
    class="viewport"
    id="viewport"
  >

    <div
      class="placeholder"
      id="placeholder"
    >

      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle
          cx="12"
          cy="12"
          r="10"
        />

        <path d="M2 12h20"/>

        <path
          d="M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20z"
        />
      </svg>

      <p>
        Enter a URL above to open a website.
      </p>

    </div>

  </div>

</div>

<script>
(function () {

  /*
   * ============================================================
   * CONFIGURATION
   * ============================================================
   */

  const PROXY_ORIGIN =
    'https://sandbox-browser-proxy.the-troy-place.workers.dev';


  /*
   * ============================================================
   * ELEMENTS
   * ============================================================
   */

  const browser =
    document.getElementById('sandboxBrowser');

  const tabStrip =
    document.getElementById('tabStrip');

  const newTabBtn =
    document.getElementById('newTabBtn');

  const viewport =
    document.getElementById('viewport');

  const urlForm =
    document.getElementById('urlForm');

  const urlInput =
    document.getElementById('urlInput');

  const backBtn =
    document.getElementById('backBtn');

  const forwardBtn =
    document.getElementById('forwardBtn');

  const reloadBtn =
    document.getElementById('reloadBtn');

  const fullscreenBtn =
    document.getElementById('fullscreenBtn');

  const statusDot =
    document.getElementById('statusDot');


  /*
   * ============================================================
   * STATE
   * ============================================================
   */

  let tabs = [];

  let activeTabId = null;

  let nextTabId = 1;


  /*
   * ============================================================
   * URL HELPERS
   * ============================================================
   */

  function normalizeUrl(raw) {

    if (!raw) {
      return null;
    }

    let value =
      raw.trim();

    if (!value) {
      return null;
    }

    /*
     * Allow users to type:
     *
     * youtube.com
     * www.youtube.com
     * https://youtube.com
     */

    if (
      !/^[a-z][a-z0-9+.-]*:\/\//i.test(value)
    ) {
      value =
        'https://' + value;
    }

    try {

      const url =
        new URL(value);

      if (
        url.protocol !== 'http:' &&
        url.protocol !== 'https:'
      ) {
        return null;
      }

      return url.href;

    } catch (error) {

      return null;

    }

  }


  function siteLabel(url) {

    try {

      return new URL(url).hostname;

    } catch (error) {

      return url;

    }

  }


  function proxiedUrl(url) {

    return (
      PROXY_ORIGIN +
      '/proxy?url=' +
      encodeURIComponent(url)
    );

  }


  /*
   * ============================================================
   * STATUS
   * ============================================================
   */

  function setStatus(state) {

    statusDot.className =
      'status-dot';

    if (state) {
      statusDot.classList.add(state);
    }

  }


  /*
   * ============================================================
   * TAB HELPERS
   * ============================================================
   */

  function activeTab() {

    return tabs.find(
      tab => tab.id === activeTabId
    ) || null;

  }


  function updateNavButtons() {

    const tab =
      activeTab();

    if (!tab) {

      backBtn.disabled = true;
      forwardBtn.disabled = true;

      return;

    }

    backBtn.disabled =
      tab.historyIndex <= 0;

    forwardBtn.disabled =
      tab.historyIndex >=
      tab.history.length - 1;

  }


  /*
   * ============================================================
   * TAB RENDERING
   * ============================================================
   */

  function renderTabs() {

    tabStrip
      .querySelectorAll('.tab')
      .forEach(el => el.remove());

    tabs.forEach(tab => {

      const el =
        document.createElement('div');

      el.className =
        'tab' +
        (
          tab.id === activeTabId
            ? ' active'
            : ''
        );

      el.dataset.id =
        String(tab.id);


      const title =
        document.createElement('span');

      title.className =
        'tab-title';

      title.textContent =
        tab.title || 'New Tab';


      const close =
        document.createElement('button');

      close.className =
        'tab-close';

      close.type =
        'button';

      close.title =
        'Close tab';

      close.textContent =
        '×';


      el.appendChild(title);
      el.appendChild(close);


      el.addEventListener(
        'click',
        function () {

          switchTab(tab.id);

        }
      );


      close.addEventListener(
        'click',
        function (event) {

          event.stopPropagation();

          closeTab(tab.id);

        }
      );


      tabStrip.insertBefore(
        el,
        newTabBtn
      );

    });

  }


  function updateTabTitle(tab, url) {

    tab.title =
      siteLabel(url) ||
      'New Tab';

    renderTabs();

  }


  /*
   * ============================================================
   * PLACEHOLDER
   * ============================================================
   */

  function showPlaceholder() {

    viewport.innerHTML = '';

    const placeholder =
      document.createElement('div');

    placeholder.className =
      'placeholder';

    placeholder.innerHTML = `
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle cx="12" cy="12" r="10"/>
        <path d="M2 12h20"/>
        <path d="M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20z"/>
      </svg>

      <p>
        Enter a URL above to open a website.
      </p>
    `;

    viewport.appendChild(
      placeholder
    );

    urlInput.value = '';

    setStatus('');

    updateNavButtons();

  }


  /*
   * ============================================================
   * ERROR
   * ============================================================
   */

  function showErrorMessage(
    url,
    reason
  ) {

    viewport.innerHTML = '';

    const msg =
      document.createElement('div');

    msg.className =
      'blocked-msg';


    const p =
      document.createElement('p');


    const site =
      document.createElement('span');

    site.className =
      'site-name';

    site.textContent =
      siteLabel(url);


    p.appendChild(site);

    p.appendChild(
      document.createTextNode(
        ' could not be loaded through the sandbox.' +
        (
          reason
            ? ' (' + reason + ')'
            : ''
        )
      )
    );


    const a =
      document.createElement('a');

    a.className =
      'open-external';

    a.href =
      url;

    a.target =
      '_blank';

    a.rel =
      'noopener noreferrer';

    a.textContent =
      'Open externally';


    msg.appendChild(p);
    msg.appendChild(a);

    viewport.appendChild(msg);

    setStatus('error');

  }


  /*
   * ============================================================
   * CREATE TAB
   * ============================================================
   */

  function createTab(
    url,
    makeActive = true
  ) {

    const id =
      nextTabId++;

    const normalized =
      url
        ? normalizeUrl(url)
        : null;


    const tab = {

      id,

      title:
        normalized
          ? siteLabel(normalized)
          : 'New Tab',

      history:
        normalized
          ? [normalized]
          : [],

      historyIndex:
        normalized
          ? 0
          : -1,

      currentToken: 0

    };


    tabs.push(tab);

    renderTabs();


    if (makeActive) {

      activeTabId =
        id;

      renderTabs();


      if (normalized) {

        loadUrl(
          normalized,
          {
            fromHistory: true,
            tabId: id
          }
        );

      } else {

        showPlaceholder();

      }

    }


    return tab;

  }


  /*
   * ============================================================
   * CLOSE TAB
   * ============================================================
   */

  function closeTab(id) {

    const index =
      tabs.findIndex(
        tab => tab.id === id
      );

    if (index === -1) {
      return;
    }


    const wasActive =
      activeTabId === id;


    tabs.splice(
      index,
      1
    );


    if (!tabs.length) {

      createTab(
        null,
        true
      );

      return;

    }


    if (wasActive) {

      const next =
        tabs[
          Math.max(
            0,
            index - 1
          )
        ] ||
        tabs[0];


      activeTabId =
        next.id;

      renderTabs();


      const currentUrl =
        next.history[
          next.historyIndex
        ];


      if (currentUrl) {

        loadUrl(
          currentUrl,
          {
            fromHistory: true,
            tabId: next.id
          }
        );

      } else {

        showPlaceholder();

      }

    } else {

      renderTabs();

    }

  }


  /*
   * ============================================================
   * SWITCH TAB
   * ============================================================
   */

  function switchTab(id) {

    const tab =
      tabs.find(
        t => t.id === id
      );

    if (!tab) {
      return;
    }


    activeTabId =
      id;

    renderTabs();


    const url =
      tab.history[
        tab.historyIndex
      ];


    if (url) {

      loadUrl(
        url,
        {
          fromHistory: true,
          tabId: id
        }
      );

    } else {

      showPlaceholder();

    }

  }


  /*
   * ============================================================
   * LOAD URL
   * ============================================================
   */

  function loadUrl(
    url,
    opts = {}
  ) {

    const tab =
      tabs.find(
        t =>
          t.id ===
          (opts.tabId || activeTabId)
      );


    if (!tab) {
      return;
    }


    const token =
      ++tab.currentToken;


    setStatus(
      'loading'
    );


    urlInput.value =
      url;


    if (
      !PROXY_ORIGIN ||
      PROXY_ORIGIN.includes(
        'YOUR-SUBDOMAIN'
      )
    ) {

      showErrorMessage(
        url,
        'Proxy is not configured'
      );

      return;

    }


    if (
      tab.id !== activeTabId
    ) {

      return;

    }


    viewport.innerHTML = '';


    /*
     * IMPORTANT:
     *
     * We intentionally do NOT use:
     *
     * allow-top-navigation
     *
     * because that would allow the proxied website to escape
     * the sandbox.
     *
     * The Worker rewrites navigation back through itself.
     */

    const iframe =
      document.createElement(
        'iframe'
      );


    iframe.setAttribute(
      'sandbox',
      [
        'allow-scripts',
        'allow-same-origin',
        'allow-forms',
        'allow-popups',
        'allow-popups-to-escape-sandbox',
        'allow-presentation',
        'allow-modals',
        'allow-downloads',
        'allow-pointer-lock'
      ].join(' ')
    );


    /*
     * Browser capabilities.
     *
     * WebGL/game support:
     *   WebGL
     *   pointer lock
     *   gamepad
     *
     * Video:
     *   autoplay
     *   fullscreen
     *   picture-in-picture
     *   encrypted media
     *
     * Modern applications:
     *   microphone
     *   camera
     *   accelerometer
     *   gyroscope
     */

    iframe.setAttribute(
      'allow',
      [
        'autoplay',
        'fullscreen',
        'picture-in-picture',
        'encrypted-media',
        'accelerometer',
        'gyroscope',
        'gamepad',
        'microphone',
        'camera',
        'clipboard-read',
        'clipboard-write'
      ].join('; ')
    );


    iframe.setAttribute(
      'allowfullscreen',
      ''
    );


    iframe.setAttribute(
      'webkitallowfullscreen',
      ''
    );


    iframe.setAttribute(
      'mozallowfullscreen',
      ''
    );


    /*
     * Avoid leaking the parent page's referrer.
     */

    iframe.referrerPolicy =
      'no-referrer';


    /*
     * IMPORTANT:
     *
     * The Worker receives the REAL target URL here.
     *
     * Example:
     *
     * https://krunker.io/?game=...
     *
     * becomes:
     *
     * https://sandbox-browser-proxy...
     * /proxy?url=https%3A...
     */

    iframe.src =
      proxiedUrl(url);


    iframe.addEventListener(
      'load',
      function () {

        if (
          token !==
            tab.currentToken ||
          tab.id !==
            activeTabId
        ) {
          return;
        }

        setStatus(
          'success'
        );

      }
    );


    iframe.addEventListener(
      'error',
      function () {

        if (
          token !==
            tab.currentToken ||
          tab.id !==
            activeTabId
        ) {
          return;
        }

        showErrorMessage(
          url,
          'Network error'
        );

      }
    );


    viewport.appendChild(
      iframe
    );


    /*
     * Add navigation to this tab's history.
     */

    if (!opts.fromHistory) {

      tab.history =
        tab.history.slice(
          0,
          tab.historyIndex + 1
        );


      tab.history.push(
        url
      );


      tab.historyIndex =
        tab.history.length - 1;

    }


    updateTabTitle(
      tab,
      url
    );

    updateNavButtons();

  }


  /*
   * ============================================================
   * URL INPUT
   * ============================================================
   */

  function goFromInput() {

    const url =
      normalizeUrl(
        urlInput.value
      );


    if (!url) {

      setStatus(
        'error'
      );

      return;

    }


    loadUrl(url);

  }


  urlForm.addEventListener(
    'submit',
    function (event) {

      event.preventDefault();

      goFromInput();

    }
  );


  /*
   * ============================================================
   * BACK
   * ============================================================
   */

  backBtn.addEventListener(
    'click',
    function () {

      const tab =
        activeTab();


      if (
        !tab ||
        tab.historyIndex <= 0
      ) {
        return;
      }


      tab.historyIndex--;


      loadUrl(
        tab.history[
          tab.historyIndex
        ],
        {
          fromHistory: true
        }
      );

    }
  );


  /*
   * ============================================================
   * FORWARD
   * ============================================================
   */

  forwardBtn.addEventListener(
    'click',
    function () {

      const tab =
        activeTab();


      if (
        !tab ||
        tab.historyIndex >=
          tab.history.length - 1
      ) {
        return;
      }


      tab.historyIndex++;


      loadUrl(
        tab.history[
          tab.historyIndex
        ],
        {
          fromHistory: true
        }
      );

    }
  );


  /*
   * ============================================================
   * RELOAD
   * ============================================================
   */

  reloadBtn.addEventListener(
    'click',
    function () {

      const tab =
        activeTab();


      if (
        tab &&
        tab.history[
          tab.historyIndex
        ]
      ) {

        loadUrl(
          tab.history[
            tab.historyIndex
          ],
          {
            fromHistory: true
          }
        );

      }

    }
  );


  /*
   * ============================================================
   * NEW TAB
   * ============================================================
   */

  newTabBtn.addEventListener(
    'click',
    function () {

      createTab(
        null,
        true
      );

      urlInput.focus();

    }
  );


  /*
   * ============================================================
   * FULLSCREEN
   * ============================================================
   */

  fullscreenBtn.addEventListener(
    'click',
    async function () {

      try {

        if (
          document.fullscreenElement
        ) {

          await document.exitFullscreen();

        } else {

          await browser.requestFullscreen();

        }

      } catch (error) {

        console.warn(
          'Fullscreen unavailable:',
          error
        );

      }

    }
  );


  document.addEventListener(
    'fullscreenchange',
    function () {

      if (
        document.fullscreenElement
      ) {

        fullscreenBtn.textContent =
          '⤢';

        fullscreenBtn.title =
          'Exit fullscreen';

      } else {

        fullscreenBtn.textContent =
          '⛶';

        fullscreenBtn.title =
          'Fullscreen';

      }

    }
  );


  /*
   * ============================================================
   * WORKER -> PARENT MESSAGES
   * ============================================================
   *
   * Your Worker injects:
   *
   * window.parent.postMessage({
   *   type: 'sandbox-new-tab',
   *   url: ...
   * }, '*');
   *
   * This listener is what actually turns that request
   * into a new browser tab in our UI.
   */

  window.addEventListener(
    'message',
    function (event) {

      const data =
        event.data;


      if (
        !data ||
        data.type !==
          'sandbox-new-tab'
      ) {
        return;
      }


      if (
        !data.url ||
        typeof data.url !==
          'string'
      ) {
        return;
      }


      let url =
        data.url;


      /*
       * The Worker may already send us a proxied URL.
       *
       * Convert it back to the original target URL when
       * possible so our tab history stays clean.
       */

      try {

        const received =
          new URL(url);


        if (
          received.origin ===
          PROXY_ORIGIN &&
          received.pathname ===
          '/proxy'
        ) {

          const target =
            received.searchParams.get(
              'url'
            );


          if (target) {

            url =
              target;

          }

        }

      } catch (error) {

        return;

      }


      url =
        normalizeUrl(url);


      if (!url) {
        return;
      }


      /*
       * Open the requested popup as a new sandbox tab.
       */

      createTab(
        url,
        true
      );

    }
  );


  /*
   * ============================================================
   * KEYBOARD SHORTCUTS
   * ============================================================
   */

  document.addEventListener(
    'keydown',
    function (event) {

      const modifier =
        event.ctrlKey ||
        event.metaKey;


      /*
       * Ctrl/Cmd + L
       */

      if (
        modifier &&
        event.key.toLowerCase() ===
          'l'
      ) {

        event.preventDefault();

        urlInput.focus();

        urlInput.select();

      }


      /*
       * Ctrl/Cmd + T
       */

      if (
        modifier &&
        event.key.toLowerCase() ===
          't'
      ) {

        event.preventDefault();

        createTab(
          null,
          true
        );

      }


      /*
       * Ctrl/Cmd + W
       */

      if (
        modifier &&
        event.key.toLowerCase() ===
          'w'
      ) {

        event.preventDefault();

        closeTab(
          activeTabId
        );

      }


      /*
       * Ctrl/Cmd + R
       */

      if (
        modifier &&
        event.key.toLowerCase() ===
          'r'
      ) {

        event.preventDefault();

        const tab =
          activeTab();


        if (
          tab &&
          tab.history[
            tab.historyIndex
          ]
        ) {

          loadUrl(
            tab.history[
              tab.historyIndex
            ],
            {
              fromHistory: true
            }
          );

        }

      }

    }
  );


  /*
   * ============================================================
   * DRAG / RESIZE FRIENDLY BEHAVIOR
   * ============================================================
   *
   * The browser itself is 100% wide/high and uses flexbox,
   * so if its parent is resized, the sandbox automatically
   * follows the new dimensions.
   */

  window.addEventListener(
    'resize',
    function () {

      /*
       * Force iframe to recalculate its layout.
       */

      const iframe =
        viewport.querySelector(
          'iframe'
        );


      if (iframe) {

        iframe.style.height =
          '100%';

        iframe.style.width =
          '100%';

      }

    }
  );


  /*
   * ============================================================
   * START
   * ============================================================
   */

  createTab(
    null,
    true
  );

})();
</script>

</body>
</html>
