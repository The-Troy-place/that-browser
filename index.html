<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sandbox Browser</title>

<style>
:root {
  --chrome-bg: #23252b;
  --chrome-bg-2: #2c2f37;
  --chrome-bg-3: #16171b;
  --border: #3a3d46;
  --text: #e8e9ec;
  --text-dim: #9a9da6;
  --accent: #4f8cff;
  --danger: #ff6b6b;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Helvetica,
    Arial,
    sans-serif;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  background: transparent;
}

body {
  overflow: hidden;
}

.sandbox-browser {
  position: relative;
  display: flex;
  flex-direction: column;

  width: 100%;
  height: 100vh;
  min-height: 420px;

  background: var(--chrome-bg);
  border: 1px solid var(--border);
  border-radius: 12px;

  overflow: hidden;

  box-shadow:
    0 8px 30px rgba(0, 0, 0, 0.25);
}

/* ------------------------------------------------------------
   Tabs
------------------------------------------------------------ */

.tab-strip {
  display: flex;
  align-items: flex-end;
  gap: 4px;

  min-height: 38px;

  padding:
    5px
    8px
    0;

  background: var(--chrome-bg);

  border-bottom:
    1px solid var(--border);

  overflow-x: auto;
  overflow-y: hidden;

  scrollbar-width: thin;
}

.tab-strip::-webkit-scrollbar {
  height: 4px;
}

.tab-strip::-webkit-scrollbar-thumb {
  background: var(--border);
  border-radius: 999px;
}

.tab {
  position: relative;

  display: flex;
  align-items: center;

  gap: 8px;

  min-width: 120px;
  max-width: 220px;

  height: 33px;

  padding:
    0
    10px;

  border:
    1px solid var(--border);

  border-bottom: none;

  border-radius:
    8px
    8px
    0
    0;

  background: var(--chrome-bg-2);

  color: var(--text-dim);

  cursor: pointer;

  user-select: none;

  flex: 0 1 auto;
}

.tab.active {
  background: var(--chrome-bg-3);
  color: var(--text);
}

.tab-title {
  flex: 1;

  min-width: 0;

  overflow: hidden;

  text-overflow: ellipsis;

  white-space: nowrap;

  font-size: 12px;
}

.tab-close {
  width: 20px;
  height: 20px;

  border: 0;

  border-radius: 5px;

  background: transparent;

  color: var(--text-dim);

  cursor: pointer;

  font-size: 16px;

  line-height: 1;
}

.tab-close:hover {
  background: rgba(255,255,255,.08);
  color: var(--text);
}

.new-tab {
  width: 30px;
  height: 30px;

  margin-bottom: 2px;

  border:
    1px solid var(--border);

  border-radius: 7px;

  background:
    var(--chrome-bg-2);

  color: var(--text);

  cursor: pointer;

  flex:
    0 0 auto;

  font-size: 18px;
}

.new-tab:hover {
  background: #383c46;
}

/* ------------------------------------------------------------
   Toolbar
------------------------------------------------------------ */

.toolbar {
  display: flex;
  align-items: center;

  gap: 8px;

  padding:
    9px
    10px;

  background:
    var(--chrome-bg);

  border-bottom:
    1px solid var(--border);

  flex-shrink: 0;
}

.nav-btn {
  width: 32px;
  height: 32px;

  display: flex;
  align-items: center;
  justify-content: center;

  background:
    var(--chrome-bg-2);

  border:
    1px solid var(--border);

  border-radius: 7px;

  color: var(--text);

  cursor: pointer;

  flex-shrink: 0;
}

.nav-btn:hover:not(:disabled) {
  background: #383c46;
}

.nav-btn:disabled {
  opacity: .35;
  cursor: default;
}

.nav-btn svg {
  width: 16px;
  height: 16px;
}

.url-form {
  flex: 1;

  display: flex;

  min-width: 0;
}

.url-bar-wrap {
  flex: 1;

  display: flex;
  align-items: center;

  gap: 8px;

  height: 34px;

  padding:
    0
    12px;

  background:
    var(--chrome-bg-2);

  border:
    1px solid var(--border);

  border-radius: 999px;

  min-width: 0;
}

.url-bar-wrap:focus-within {
  border-color: var(--accent);
}

.lock-icon {
  width: 13px;
  height: 13px;

  color: var(--text-dim);

  flex-shrink: 0;
}

.url-input {
  flex: 1;

  min-width: 0;

  background: transparent;

  border: none;

  outline: none;

  color: var(--text);

  font-size: 13px;
}

.url-input::placeholder {
  color: var(--text-dim);
}

.go-btn {
  display: flex;
  align-items: center;

  padding: 2px;

  background: none;

  border: none;

  color: var(--text-dim);

  cursor: pointer;
}

.go-btn:hover {
  color: var(--text);
}

.go-btn svg {
  width: 16px;
  height: 16px;
}

.fullscreen-btn {
  width: 34px;
  height: 34px;

  border:
    1px solid var(--border);

  border-radius: 7px;

  background:
    var(--chrome-bg-2);

  color: var(--text);

  cursor: pointer;

  flex-shrink: 0;

  font-size: 17px;
}

.fullscreen-btn:hover {
  background: #383c46;
}

.status-dot {
  width: 7px;
  height: 7px;

  border-radius: 50%;

  background: var(--text-dim);

  flex-shrink: 0;
}

.status-dot.loading {
  background: var(--accent);

  animation:
    pulse .9s
    ease-in-out
    infinite;
}

.status-dot.error {
  background: var(--danger);
}

@keyframes pulse {
  0%, 100% {
    opacity: 1;
  }

  50% {
    opacity: .3;
  }
}

/* ------------------------------------------------------------
   Viewport
------------------------------------------------------------ */

.viewport {
  position: relative;

  flex: 1;

  min-height: 0;

  background: #16171b;

  overflow: hidden;
}

.viewport iframe {
  display: block;

  width: 100%;
  height: 100%;

  border: none;

  background: white;
}

/*
 * Loading overlay
 */

.loading-overlay {
  position: absolute;

  inset: 0;

  z-index: 20;

  display: flex;
  align-items: center;
  justify-content: center;

  pointer-events: none;

  opacity: 0;

  transition: opacity .15s ease;

  background:
    rgba(22, 23, 27, .35);
}

.loading-overlay.visible {
  opacity: 1;
}

.spinner {
  width: 30px;
  height: 30px;

  border:
    3px solid
    rgba(255,255,255,.18);

  border-top-color:
    var(--accent);

  border-radius: 50%;

  animation:
    spin .7s
    linear
    infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

/* ------------------------------------------------------------
   Placeholder / error
------------------------------------------------------------ */

.placeholder,
.blocked-msg {
  position: absolute;

  inset: 0;

  display: flex;

  flex-direction: column;

  align-items: center;
  justify-content: center;

  text-align: center;

  padding: 32px;

  color: var(--text-dim);

  gap: 10px;
}

.placeholder svg,
.blocked-msg svg {
  width: 42px;
  height: 42px;

  opacity: .5;

  margin-bottom: 6px;
}

.placeholder p,
.blocked-msg p {
  margin: 0;

  font-size: 13px;

  line-height: 1.5;

  max-width: 420px;
}

.blocked-msg .site-name {
  color: var(--text);

  font-weight: 600;
}

.open-external {
  margin-top: 8px;

  font-size: 12.5px;

  color: var(--accent);

  text-decoration: none;

  border:
    1px solid
    var(--border);

  padding:
    7px
    14px;

  border-radius: 999px;
}

.open-external:hover {
  border-color: var(--accent);
}

/* ------------------------------------------------------------
   Footer
------------------------------------------------------------ */

.footer-note {
  display: none;

  padding:
    6px
    14px;

  font-size: 11px;

  color: var(--text-dim);

  background:
    var(--chrome-bg);

  border-top:
    1px solid
    var(--border);
}

/*
 * The proxy indicator is intentionally hidden.
 * The browser can therefore look like a normal full-screen browser.
 */

/* ------------------------------------------------------------
   Responsive
------------------------------------------------------------ */

@media (max-width: 650px) {
  .toolbar {
    gap: 5px;

    padding:
      7px;
  }

  .nav-btn {
    width: 30px;
    height: 30px;
  }

  .fullscreen-btn {
    width: 30px;
    height: 30px;
  }

  .url-bar-wrap {
    height: 30px;

    padding:
      0
      9px;
  }

  .tab {
    min-width: 105px;
  }

  .tab-strip {
    padding-left: 5px;
    padding-right: 5px;
  }
}

@media (max-width: 450px) {
  .toolbar {
    gap: 4px;
  }

  .nav-btn:nth-child(2) {
    display: none;
  }

  .url-bar-wrap {
    padding-left: 9px;
    padding-right: 7px;
  }

  .tab {
    min-width: 95px;
  }
}

/*
 * When fullscreen is active, remove rounded edges.
 */

.sandbox-browser:fullscreen {
  width: 100vw;
  height: 100vh;

  border: none;

  border-radius: 0;
}
</style>

</head>

<script>
(function () {
  "use strict";

  /*
   * ============================================================
   * CONFIGURATION
   * ============================================================
   */

  const PROXY_ORIGIN =
    "https://sandbox-browser-proxy.the-troy-place.workers.dev";


  /*
   * ============================================================
   * ELEMENTS
   * ============================================================
   */

  const browser =
    document.getElementById(
      "sandboxBrowser"
    );

  const tabStrip =
    document.getElementById(
      "tabStrip"
    );

  const newTabBtn =
    document.getElementById(
      "newTabBtn"
    );

  const viewport =
    document.getElementById(
      "viewport"
    );

  const urlForm =
    document.getElementById(
      "urlForm"
    );

  const urlInput =
    document.getElementById(
      "urlInput"
    );

  const backBtn =
    document.getElementById(
      "backBtn"
    );

  const forwardBtn =
    document.getElementById(
      "forwardBtn"
    );

  const reloadBtn =
    document.getElementById(
      "reloadBtn"
    );

  const fullscreenBtn =
    document.getElementById(
      "fullscreenBtn"
    );

  const statusDot =
    document.getElementById(
      "statusDot"
    );

  const loadingOverlay =
    document.getElementById(
      "loadingOverlay"
    );


  /*
   * ============================================================
   * STATE
   * ============================================================
   */

  let tabs = [];

  let activeTabId = null;

  let nextTabId = 1;


  /*
   * ============================================================
   * URL HELPERS
   * ============================================================
   */

  function normalizeUrl(raw) {
    let value =
      String(raw || "")
        .trim();

    if (!value) {
      return null;
    }

    /*
     * If the user types something like:
     *
     * youtube.com
     *
     * turn it into:
     *
     * https://youtube.com
     */

    if (
      !/^[a-z][a-z0-9+.-]*:\/\//i.test(
        value
      )
    ) {
      value =
        "https://" +
        value;
    }

    try {
      const url =
        new URL(value);

      if (
        !/^https?:$/i.test(
          url.protocol
        )
      ) {
        return null;
      }

      return url.href;

    } catch {
      return null;
    }
  }


  function siteLabel(url) {
    try {
      return new URL(url).hostname;
    } catch {
      return url || "New Tab";
    }
  }


  function proxiedUrl(url) {
    return (
      PROXY_ORIGIN +
      "/proxy?url=" +
      encodeURIComponent(url)
    );
  }


  function isProxyUrl(url) {
    return (
      typeof url === "string" &&
      url.indexOf(
        PROXY_ORIGIN +
        "/proxy?url="
      ) === 0
    );
  }


  /*
   * The Worker sends proxy URLs in postMessage events.
   *
   * Convert them back to the actual target URL before
   * putting them in our browser history.
   */

  function unwrapProxyUrl(url) {
    try {
      const parsed =
        new URL(url);

      if (
        parsed.origin !==
        PROXY_ORIGIN
      ) {
        return url;
      }

      if (
        parsed.pathname !==
        "/proxy"
      ) {
        return url;
      }

      const target =
        parsed.searchParams.get(
          "url"
        );

      return target ||
        url;

    } catch {
      return url;
    }
  }


  /*
   * ============================================================
   * STATUS
   * ============================================================
   */

  function setStatus(state) {
    statusDot.className =
      "status-dot" +
      (
        state
          ? " " + state
          : ""
      );
  }


  function setLoading(value) {
    loadingOverlay.classList.toggle(
      "visible",
      value
    );

    if (value) {
      setStatus("loading");
    }
  }


  /*
   * ============================================================
   * ACTIVE TAB
   * ============================================================
   */

  function activeTab() {
    return tabs.find(
      tab =>
        tab.id ===
        activeTabId
    ) || null;
  }


  /*
   * ============================================================
   * NAVIGATION BUTTONS
   * ============================================================
   */

  function updateNavButtons() {
    const tab =
      activeTab();

    if (!tab) {
      backBtn.disabled = true;
      forwardBtn.disabled = true;
      return;
    }

    backBtn.disabled =
      tab.historyIndex <= 0;

    forwardBtn.disabled =
      tab.historyIndex >=
      tab.history.length - 1;
  }


  /*
   * ============================================================
   * TAB RENDERING
   * ============================================================
   */

  function renderTabs() {
    tabStrip
      .querySelectorAll(
        ".tab"
      )
      .forEach(
        el =>
          el.remove()
      );

    tabs.forEach(
      tab => {
        const el =
          document.createElement(
            "div"
          );

        el.className =
          "tab" +
          (
            tab.id ===
            activeTabId
              ? " active"
              : ""
          );

        el.dataset.id =
          String(tab.id);


        const title =
          document.createElement(
            "span"
          );

        title.className =
          "tab-title";

        title.textContent =
          tab.title ||
          "New Tab";


        const close =
          document.createElement(
            "button"
          );

        close.className =
          "tab-close";

        close.type =
          "button";

        close.title =
          "Close tab";

        close.textContent =
          "×";


        el.appendChild(
          title
        );

        el.appendChild(
          close
        );


        el.addEventListener(
          "click",
          () => {
            switchTab(
              tab.id
            );
          }
        );


        close.addEventListener(
          "click",
          event => {
            event.stopPropagation();

            closeTab(
              tab.id
            );
          }
        );


        tabStrip.insertBefore(
          el,
          newTabBtn
        );
      }
    );
  }


  function updateTabTitle(
    tab,
    url,
    documentTitle
  ) {
    if (
      documentTitle &&
      documentTitle.trim()
    ) {
      tab.title =
        documentTitle
          .trim()
          .slice(
            0,
            60
          );
    } else {
      tab.title =
        siteLabel(url);
    }

    renderTabs();
  }


  /*
   * ============================================================
   * PLACEHOLDER
   * ============================================================
   */

  function showPlaceholder() {
    viewport
      .querySelectorAll(
        "iframe, .placeholder, .blocked-msg"
      )
      .forEach(
        el =>
          el.remove()
      );


    const placeholder =
      document.createElement(
        "div"
      );

    placeholder.className =
      "placeholder";


    placeholder.innerHTML = `
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle cx="12" cy="12" r="10"/>
        <path d="M2 12h20"/>
        <path d="M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20z"/>
      </svg>

      <p>
        Enter a URL above to open a website.
      </p>
    `;


    viewport.insertBefore(
      placeholder,
      loadingOverlay
    );


    urlInput.value =
      "";

    setStatus("");

    setLoading(false);

    updateNavButtons();
  }


  /*
   * ============================================================
   * ERROR
   * ============================================================
   */

  function showErrorMessage(
    url,
    reason
  ) {
    viewport
      .querySelectorAll(
        "iframe, .placeholder, .blocked-msg"
      )
      .forEach(
        el =>
          el.remove()
      );


    const msg =
      document.createElement(
        "div"
      );

    msg.className =
      "blocked-msg";


    const p =
      document.createElement(
        "p"
      );


    const site =
      document.createElement(
        "span"
      );

    site.className =
      "site-name";

    site.textContent =
      siteLabel(url);


    p.appendChild(
      site
    );


    p.appendChild(
      document.createTextNode(
        " could not be loaded through the sandbox." +
        (
          reason
            ? " " + reason
            : ""
        )
      )
    );


    const external =
      document.createElement(
        "a"
      );

    external.className =
      "open-external";

    external.href =
      url;

    external.target =
      "_blank";

    external.rel =
      "noopener noreferrer";

    external.textContent =
      "Open externally";


    msg.appendChild(
      p
    );

    msg.appendChild(
      external
    );


    viewport.insertBefore(
      msg,
      loadingOverlay
    );


    setLoading(false);

    setStatus("error");
  }


  /*
   * ============================================================
   * LOAD URL
   * ============================================================
   */

  function loadUrl(
    url,
    options
  ) {
    options =
      options || {};


    const tab =
      tabs.find(
        t =>
          t.id ===
          (
            options.tabId ||
            activeTabId
          )
      );


    if (!tab) {
      return;
    }


    const token =
      ++tab.currentToken;


    setLoading(true);


    urlInput.value =
      url;


    /*
     * Remove previous iframe.
     */

    viewport
      .querySelectorAll(
        "iframe, .placeholder, .blocked-msg"
      )
      .forEach(
        el =>
          el.remove()
      );


    /*
     * Create iframe.
     */

    const iframe =
      document.createElement(
        "iframe"
      );


    /*
     * Important:
     *
     * These permissions are needed by modern websites,
     * video players, games, fullscreen applications,
     * etc.
     */

    iframe.setAttribute(
      "sandbox",
      [
        "allow-scripts",
        "allow-same-origin",
        "allow-forms",
        "allow-popups",
        "allow-popups-to-escape-sandbox",
        "allow-presentation",
        "allow-modals",
        "allow-downloads",
        "allow-pointer-lock",
        "allow-top-navigation-by-user-activation"
      ].join(" ")
    );


    iframe.setAttribute(
      "allow",
      [
        "autoplay",
        "fullscreen",
        "picture-in-picture",
        "encrypted-media",
        "accelerometer",
        "gyroscope",
        "gamepad",
        "clipboard-read",
        "clipboard-write",
        "microphone",
        "camera"
      ].join("; ")
    );


    iframe.setAttribute(
      "allowfullscreen",
      ""
    );


    iframe.referrerPolicy =
      "no-referrer";


    /*
     * The Worker handles:
     *
     * HTML
     * JS
     * CSS
     * fetch
     * XHR
     * WebSocket
     * video
     * audio
     * images
     * redirects
     * etc.
     */

    iframe.src =
      proxiedUrl(url);


    /*
     * ----------------------------------------------------------
     * Iframe load
     * ----------------------------------------------------------
     */

    iframe.addEventListener(
      "load",
      () => {
        if (
          token !==
          tab.currentToken
        ) {
          return;
        }

        if (
          tab.id !==
          activeTabId
        ) {
          return;
        }

        setLoading(false);

        setStatus("");

        /*
         * We intentionally don't try to inspect iframe.location
         * here because the iframe contains a sandboxed document.
         *
         * Navigation updates come from postMessage.
         */
      }
    );


    iframe.addEventListener(
      "error",
      () => {
        if (
          token !==
          tab.currentToken
        ) {
          return;
        }

        showErrorMessage(
          url,
          "The proxy returned a network error."
        );
      }
    );


    /*
     * ----------------------------------------------------------
     * Insert iframe
     * ----------------------------------------------------------
     */

    viewport.insertBefore(
      iframe,
      loadingOverlay
    );


    /*
     * ----------------------------------------------------------
     * History
     * ----------------------------------------------------------
     */

    if (
      !options.fromHistory &&
      !options.fromProxyNavigation
    ) {
      /*
       * Don't duplicate the current URL.
       */

      if (
        tab.history[
          tab.historyIndex
        ] !== url
      ) {
        tab.history =
          tab.history.slice(
            0,
            tab.historyIndex + 1
          );

        tab.history.push(
          url
        );

        tab.historyIndex =
          tab.history.length - 1;
      }
    }


    updateTabTitle(
      tab,
      url
    );

    updateNavButtons();
  }


  /*
   * ============================================================
   * CREATE TAB
   * ============================================================
   */

  function createTab(
    url,
    makeActive
  ) {
    const id =
      nextTabId++;


    const normalized =
      url
        ? normalizeUrl(url)
        : null;


    const tab = {
      id,

      title:
        normalized
          ? siteLabel(normalized)
          : "New Tab",

      history:
        normalized
          ? [normalized]
          : [],

      historyIndex:
        normalized
          ? 0
          : -1,

      currentToken:
        0
    };


    tabs.push(
      tab
    );


    if (
      makeActive !== false
    ) {
      activeTabId =
        id;

      renderTabs();


      if (
        normalized
      ) {
        loadUrl(
          normalized,
          {
            fromHistory: true,
            tabId: id
          }
        );
      } else {
        showPlaceholder();
      }

    } else {
      renderTabs();
    }


    return tab;
  }


  /*
   * ============================================================
   * CLOSE TAB
   * ============================================================
   */

  function closeTab(id) {
    const index =
      tabs.findIndex(
        t =>
          t.id === id
      );


    if (
      index === -1
    ) {
      return;
    }


    const wasActive =
      activeTabId === id;


    tabs.splice(
      index,
      1
    );


    if (
      !tabs.length
    ) {
      createTab(
        null,
        true
      );

      return;
    }


    if (
      wasActive
    ) {
      const next =
        tabs[
          Math.max(
            0,
            index - 1
          )
        ] ||
        tabs[0];


      activeTabId =
        next.id;


      renderTabs();


      const current =
        next.history[
          next.historyIndex
        ];


      if (current) {
        loadUrl(
          current,
          {
            fromHistory: true,
            tabId: next.id
          }
        );
      } else {
        showPlaceholder();
      }

    } else {
      renderTabs();
    }
  }


  /*
   * ============================================================
   * SWITCH TAB
   * ============================================================
   */

  function switchTab(id) {
    const tab =
      tabs.find(
        t =>
          t.id === id
      );


    if (!tab) {
      return;
    }


    activeTabId =
      id;


    renderTabs();


    const current =
      tab.history[
        tab.historyIndex
      ];


    if (current) {
      loadUrl(
        current,
        {
          fromHistory: true,
          tabId: id
        }
      );
    } else {
      showPlaceholder();
    }
  }


  /*
   * ============================================================
   * INPUT NAVIGATION
   * ============================================================
   */

  function goFromInput() {
    const value =
      urlInput.value.trim();


    if (!value) {
      return;
    }


    /*
     * Basic search support:
     *
     * typing "cats" becomes a Google search.
     */

    let url =
      normalizeUrl(value);


    if (!url) {
      return;
    }


    const tab =
      activeTab();


    if (!tab) {
      return;
    }


    loadUrl(
      url
    );
  }


  urlForm.addEventListener(
    "submit",
    event => {
      event.preventDefault();

      goFromInput();
    }
  );


  /*
   * ============================================================
   * BACK
   * ============================================================
   */

  backBtn.addEventListener(
    "click",
    () => {
      const tab =
        activeTab();


      if (
        !tab ||
        tab.historyIndex <= 0
      ) {
        return;
      }


      tab.historyIndex--;


      loadUrl(
        tab.history[
          tab.historyIndex
        ],
        {
          fromHistory: true,
          tabId: tab.id
        }
      );
    }
  );


  /*
   * ============================================================
   * FORWARD
   * ============================================================
   */

  forwardBtn.addEventListener(
    "click",
    () => {
      const tab =
        activeTab();


      if (
        !tab ||
        tab.historyIndex >=
          tab.history.length - 1
      ) {
        return;
      }


      tab.historyIndex++;


      loadUrl(
        tab.history[
          tab.historyIndex
        ],
        {
          fromHistory: true,
          tabId: tab.id
        }
      );
    }
  );


  /*
   * ============================================================
   * RELOAD
   * ============================================================
   */

  reloadBtn.addEventListener(
    "click",
    () => {
      const tab =
        activeTab();


      if (!tab) {
        return;
      }


      const url =
        tab.history[
          tab.historyIndex
        ];


      if (url) {
        loadUrl(
          url,
          {
            fromHistory: true,
            tabId: tab.id
          }
        );
      }
    }
  );


  /*
   * ============================================================
   * NEW TAB
   * ============================================================
   */

  newTabBtn.addEventListener(
    "click",
    () => {
      createTab(
        null,
        true
      );

      urlInput.focus();
    }
  );


  /*
   * ============================================================
   * FULLSCREEN
   * ============================================================
   */

  fullscreenBtn.addEventListener(
    "click",
    async () => {
      try {
        if (
          document.fullscreenElement
        ) {
          await document.exitFullscreen();
        } else {
          await browser.requestFullscreen();
        }
      } catch {}
    }
  );


  document.addEventListener(
    "fullscreenchange",
    () => {
      if (
        document.fullscreenElement
      ) {
        fullscreenBtn.textContent =
          "⤢";

        fullscreenBtn.title =
          "Exit fullscreen";
      } else {
        fullscreenBtn.textContent =
          "⛶";

        fullscreenBtn.title =
          "Fullscreen";
      }
    }
  );


  /*
   * ============================================================
   * MESSAGES FROM THE PROXY PAGE
   * ============================================================
   */

  window.addEventListener(
    "message",
    event => {
      /*
       * We only trust messages from our own proxy.
       */

      if (
        event.origin !==
        PROXY_ORIGIN
      ) {
        return;
      }


      const data =
        event.data;


      if (
        !data ||
        typeof data !==
          "object"
      ) {
        return;
      }


      const tab =
        activeTab();


      if (!tab) {
        return;
      }


      /*
       * --------------------------------------------------------
       * Navigation
       *
       * The Worker sends:
       *
       * {
       *   type: "sandbox-navigation",
       *   url: "..."
       * }
       * --------------------------------------------------------
       */

      if (
        data.type ===
        "sandbox-navigation"
      ) {
        const realUrl =
          unwrapProxyUrl(
            data.url
          );


        const normalized =
          normalizeUrl(
            realUrl
          );


        if (!normalized) {
          return;
        }


        /*
         * Ignore duplicate navigation reports.
         */

        if (
          tab.history[
            tab.historyIndex
          ] === normalized
        ) {
          updateTabTitle(
            tab,
            normalized,
            data.title
          );

          urlInput.value =
            normalized;

          return;
        }


        /*
         * If this is a genuine navigation,
         * append it to browser history.
         */

        tab.history =
          tab.history.slice(
            0,
            tab.historyIndex + 1
          );


        tab.history.push(
          normalized
        );


        tab.historyIndex =
          tab.history.length - 1;


        updateTabTitle(
          tab,
          normalized,
          data.title
        );


        urlInput.value =
          normalized;


        updateNavButtons();

        return;
      }


      /*
       * --------------------------------------------------------
       * New tab
       *
       * window.open() in the Worker-injected page sends:
       *
       * {
       *   type: "sandbox-new-tab",
       *   url: "..."
       * }
       * --------------------------------------------------------
       */

      if (
        data.type ===
        "sandbox-new-tab"
      ) {
        const realUrl =
          unwrapProxyUrl(
            data.url
          );


        const normalized =
          normalizeUrl(
            realUrl
          );


        if (!normalized) {
          return;
        }


        createTab(
          normalized,
          true
        );

        return;
      }
    }
  );


  /*
   * ============================================================
   * KEYBOARD SHORTCUTS
   * ============================================================
   */

  document.addEventListener(
    "keydown",
    event => {
      const modifier =
        event.ctrlKey ||
        event.metaKey;


      /*
       * Ctrl/Cmd + L
       */

      if (
        modifier &&
        event.key.toLowerCase() ===
          "l"
      ) {
        event.preventDefault();

        urlInput.focus();

        urlInput.select();

        return;
      }


      /*
       * Ctrl/Cmd + T
       */

      if (
        modifier &&
        event.key.toLowerCase() ===
          "t"
      ) {
        event.preventDefault();

        createTab(
          null,
          true
        );

        return;
      }


      /*
       * Ctrl/Cmd + W
       */

      if (
        modifier &&
        event.key.toLowerCase() ===
          "w"
      ) {
        event.preventDefault();

        closeTab(
          activeTabId
        );

        return;
      }


      /*
       * Alt + Left
       */

      if (
        event.altKey &&
        event.key ===
          "ArrowLeft"
      ) {
        event.preventDefault();

        backBtn.click();

        return;
      }


      /*
       * Alt + Right
       */

      if (
        event.altKey &&
        event.key ===
          "ArrowRight"
      ) {
        event.preventDefault();

        forwardBtn.click();

        return;
      }
    }
  );


  /*
   * ============================================================
   * AUTO FOCUS / FULLSCREEN
   * ============================================================
   */

  let fullscreenAttempted =
    false;


  browser.addEventListener(
    "pointerdown",
    () => {
      if (
        fullscreenAttempted
      ) {
        return;
      }

      fullscreenAttempted =
        true;


      /*
       * We don't force fullscreen automatically anymore.
       *
       * The browser can deny fullscreen if the page is embedded
       * in another iframe.
       */
    },
    {
      once: true
    }
  );


  /*
   * ============================================================
   * START
   * ============================================================
   */

  createTab(
    null,
    true
  );

})();
</script>

</body>
</html>
