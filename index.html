<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sandbox Browser Proxy</title>
</head>
<body>
  <h1>Sandbox Browser Proxy</h1>

  <script>
    // 1. Safe Service Worker Registration
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((reg) => console.log('Service Worker registered successfully:', reg.scope))
          .catch((err) => console.error('Service Worker registration failed:', err));
      });
    }

    // 2. Helper function to call Youtube API through worker
    const PROXY_BASE = 'https://sandbox-browser-proxy.the-troy-place.workers.dev/proxy?url=';

    async function fetchYouTubePlayer(videoId) {
      const targetUrl = 'https://www.youtube.com/youtubei/v1/player';
      const proxyUrl = PROXY_BASE + encodeURIComponent(targetUrl);

      const payload = {
        context: {
          client: {
            clientName: 'WEB',
            clientVersion: '2.20240101.00.00'
          }
        },
        videoId: videoId
      };

      try {
        // MUST use POST for youtubei/v1/player endpoint
        const response = await fetch(proxyUrl, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          throw new Error(`HTTP error! Status: ${response.status}`);
        }

        const data = await response.json();
        console.log('YouTube Player API Data:', data);
        return data;
      } catch (err) {
        console.error('Failed to fetch player data:', err);
      }
    }
  </script>
</body>
</html>
