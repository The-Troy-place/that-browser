<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proxy Application</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; background: #121212; color: #fff; }
    #nav { height: 48px; background: #1f1f1f; display: flex; align-items: center; padding: 0 12px; gap: 8px; border-bottom: 1px solid #333; }
    #url-input { flex: 1; height: 32px; background: #2b2b2b; border: 1px solid #444; border-radius: 4px; color: #fff; padding: 0 12px; outline: none; }
    #go-btn { height: 32px; padding: 0 16px; background: #0070f3; border: none; border-radius: 4px; color: #fff; font-weight: bold; cursor: pointer; }
    #go-btn:hover { background: #0051a8; }
    #frame-container { width: 100%; height: calc(100% - 48px); background: #000; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

  <div id="nav">
    <input type="text" id="url-input" placeholder="Enter full URL (e.g., https://youtube.com)">
    <button id="go-btn" onclick="loadUrl()">Go</button>
  </div>

  <div id="frame-container">
    <iframe id="sandbox-frame" allow="fullscreen; pointer-lock; autoplay; camera; microphone"></iframe>
  </div>

  <script>
    // REPLACE THIS WITH YOUR CLOUDFLARE WORKER URL
    const WORKER_URL = "https://your-worker-name.subdomain.workers.dev";

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js', { scope: '/' })
        .then(() => console.log('Proxy Service Worker registered'))
        .catch(err => console.error('Service Worker Registration Failed:', err));
    }

    function loadUrl() {
      const input = document.getElementById('url-input').value.trim();
      if (!input) return;

      let targetUrl = input;
      if (!targetUrl.startsWith('http://') && !targetUrl.startsWith('https://')) {
        targetUrl = 'https://' + targetUrl;
      }

      const proxyUrl = WORKER_URL + '/proxy?url=' + encodeURIComponent(targetUrl);
      document.getElementById('sandbox-frame').src = proxyUrl;
    }

    document.getElementById('url-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') loadUrl();
    });
  </script>

</body>
</html>
