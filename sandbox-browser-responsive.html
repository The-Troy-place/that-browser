<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sandbox Browser</title>
<style>
:root {
  --chrome-bg:#23252b;
  --chrome-bg-2:#2c2f37;
  --chrome-bg-3:#1b1d22;
  --border:#3a3d46;
  --text:#e8e9ec;
  --text-dim:#9a9da6;
  --accent:#4f8cff;
  --danger:#ff6b6b;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input{font:inherit}

.sandbox-browser{
  display:flex;
  flex-direction:column;
  width:100%;
  height:min(88vh,760px);
  min-height:420px;
  background:var(--chrome-bg);
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 8px 30px rgba(0,0,0,.25);
  resize:vertical;
  min-width:0;
}

.tabs{
  display:flex;
  align-items:flex-end;
  gap:4px;
  min-height:42px;
  padding:6px 6px 0;
  background:var(--chrome-bg-3);
  border-bottom:1px solid var(--border);
  overflow-x:auto;
  scrollbar-width:thin;
}
.tab{
  display:flex;
  align-items:center;
  gap:7px;
  min-width:120px;
  max-width:220px;
  height:36px;
  padding:0 8px 0 12px;
  color:var(--text-dim);
  background:var(--chrome-bg-2);
  border:1px solid var(--border);
  border-bottom:none;
  border-radius:8px 8px 0 0;
  cursor:pointer;
  flex:0 1 180px;
}
.tab.active{color:var(--text);background:var(--chrome-bg)}
.tab-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.tab-close{
  width:24px;height:24px;border:0;border-radius:5px;
  background:transparent;color:var(--text-dim);cursor:pointer;
}
.tab-close:hover{background:#3b3e47;color:var(--text)}
.new-tab{
  flex:0 0 auto;
  width:34px;height:34px;margin:0 0 1px 2px;
  border:0;border-radius:7px;background:transparent;color:var(--text);
  cursor:pointer;font-size:20px;
}
.new-tab:hover{background:var(--chrome-bg-2)}

.toolbar{
  display:flex;align-items:center;gap:7px;padding:8px 10px;
  background:var(--chrome-bg);border-bottom:1px solid var(--border);
  flex-wrap:nowrap;
}
.nav-btn{
  width:34px;height:34px;display:flex;align-items:center;justify-content:center;
  background:var(--chrome-bg-2);border:1px solid var(--border);
  border-radius:7px;color:var(--text);cursor:pointer;flex:0 0 auto;
}
.nav-btn:hover:not(:disabled){background:#383c46}
.nav-btn:disabled{opacity:.35;cursor:default}
.nav-btn svg{width:16px;height:16px}
.url-form{flex:1;min-width:0;display:flex}
.url-bar-wrap{
  flex:1;min-width:0;display:flex;align-items:center;gap:8px;
  background:var(--chrome-bg-2);border:1px solid var(--border);
  border-radius:999px;padding:0 12px;height:34px;
}
.url-bar-wrap:focus-within{border-color:var(--accent)}
.lock-icon{width:13px;height:13px;color:var(--text-dim);flex:0 0 auto}
.url-input{
  flex:1;min-width:0;background:transparent;border:0;outline:0;
  color:var(--text);font-size:13px;
}
.url-input::placeholder{color:var(--text-dim)}
.go-btn{
  background:none;border:0;color:var(--text-dim);cursor:pointer;
  display:flex;align-items:center;padding:2px;flex:0 0 auto
}
.go-btn:hover{color:var(--text)}
.status-dot{
  width:7px;height:7px;border-radius:50%;background:var(--text-dim);
  flex:0 0 auto
}
.status-dot.loading{background:var(--accent);animation:pulse .9s ease-in-out infinite}
.status-dot.error{background:var(--danger)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

.viewport{position:relative;flex:1;min-height:0;background:#16171b}
.frame-wrap{position:absolute;inset:0;display:none}
.frame-wrap.active{display:block}
.viewport iframe{
  width:100%;height:100%;border:0;background:#fff;display:block;
}
.placeholder,.blocked-msg{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
  padding:32px;color:var(--text-dim);gap:10px
}
.placeholder p,.blocked-msg p{margin:0;font-size:13px;line-height:1.5;max-width:520px}
.placeholder svg,.blocked-msg svg{width:40px;height:40px;opacity:.5;margin-bottom:6px}
.blocked-msg .site-name{color:var(--text);font-weight:600}
.open-external{
  margin-top:8px;font-size:12.5px;color:var(--accent);text-decoration:none;
  border:1px solid var(--border);padding:7px 14px;border-radius:999px
}
.open-external:hover{border-color:var(--accent)}
.footer-note{
  padding:6px 14px;font-size:11px;color:var(--text-dim);
  background:var(--chrome-bg);border-top:1px solid var(--border);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.footer-note code{background:var(--chrome-bg-2);padding:1px 5px;border-radius:4px}

@media (max-width:700px){
  .sandbox-browser{
    height:calc(100dvh - 12px);
    min-height:360px;
    border-radius:8px;
  }
  .tabs{min-height:40px}
  .tab{min-width:110px;max-width:170px;flex-basis:145px}
  .toolbar{gap:5px;padding:6px}
  .nav-btn{width:32px;height:32px}
  .url-bar-wrap{height:32px;padding:0 9px}
  .footer-note{display:none}
}
@media (max-width:460px){
  .toolbar .nav-btn:nth-child(3){display:none}
  .tab{min-width:100px;flex-basis:120px}
  .url-input{font-size:12px}
}
</style>
</head>
<body>
<div class="sandbox-browser" id="sandboxBrowser">
  <div class="tabs" id="tabs"></div>

  <div class="toolbar">
    <button class="nav-btn" id="backBtn" title="Back" disabled aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button class="nav-btn" id="forwardBtn" title="Forward" disabled aria-label="Forward">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
    </button>
    <button class="nav-btn" id="reloadBtn" title="Reload" aria-label="Reload">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6M3.5 9a9 9 0 0 1 14.9-3.4L23 10M1 14l4.6 4.4A9 9 0 0 0 20.5 15"/></svg>
    </button>

    <form class="url-form" id="urlForm">
      <div class="url-bar-wrap">
        <svg class="lock-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <input class="url-input" id="urlInput" type="text" placeholder="Enter a URL…" autocomplete="off" spellcheck="false">
        <span class="status-dot" id="statusDot"></span>
        <button class="go-btn" type="submit" title="Go" aria-label="Go">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </div>
    </form>
  </div>

  <div class="viewport" id="viewport"></div>

  <div class="footer-note">
    Pages are loaded through <code id="proxyOriginLabel"></code>. The proxy must rewrite links, forms, redirects, media URLs, and streaming requests.
  </div>
</div>

<script>
(function(){
  // Your deployed Cloudflare Worker URL, without a trailing slash.
  const PROXY_ORIGIN = 'https://sandbox-browser-proxy.the-troy-place.workers.dev';
  const PROXY_PATH = '/proxy?url=';

  const tabsEl = document.getElementById('tabs');
  const viewport = document.getElementById('viewport');
  const urlForm = document.getElementById('urlForm');
  const urlInput = document.getElementById('urlInput');
  const backBtn = document.getElementById('backBtn');
  const forwardBtn = document.getElementById('forwardBtn');
  const reloadBtn = document.getElementById('reloadBtn');
  const statusDot = document.getElementById('statusDot');
  document.getElementById('proxyOriginLabel').textContent = PROXY_ORIGIN;

  let tabs = [];
  let activeTabId = null;
  let nextTabId = 1;

  function normalizeUrl(raw){
    let v = String(raw || '').trim();
    if(!v) return null;
    if(!/^[a-z][a-z0-9+.-]*:\/\//i.test(v)) v = 'https://' + v;
    try{
      const u = new URL(v);
      if(!['http:','https:'].includes(u.protocol)) return null;
      return u.href;
    }catch(e){ return null; }
  }

  function siteLabel(url){
    try{return new URL(url).hostname.replace(/^www\./,'')}catch(e){return url}
  }

  function proxiedUrl(url){
    return PROXY_ORIGIN + PROXY_PATH + encodeURIComponent(url);
  }

  function activeTab(){
    return tabs.find(t => t.id === activeTabId) || null;
  }

  function setStatus(state){
    statusDot.className = 'status-dot' + (state ? ' ' + state : '');
  }

  function updateNavButtons(){
    const t = activeTab();
    if(!t){
      backBtn.disabled = true;
      forwardBtn.disabled = true;
      return;
    }
    backBtn.disabled = t.historyIndex <= 0;
    forwardBtn.disabled = t.historyIndex >= t.history.length - 1;
  }

  function renderTabs(){
    tabsEl.innerHTML = '';
    tabs.forEach(t => {
      const el = document.createElement('div');
      el.className = 'tab' + (t.id === activeTabId ? ' active' : '');
      el.title = t.title || 'New Tab';

      const title = document.createElement('span');
      title.className = 'tab-title';
      title.textContent = t.title || 'New Tab';

      const close = document.createElement('button');
      close.className = 'tab-close';
      close.type = 'button';
      close.title = 'Close tab';
      close.textContent = '×';
      close.addEventListener('click', e => {
        e.stopPropagation();
        closeTab(t.id);
      });

      el.append(title, close);
      el.addEventListener('click', () => activateTab(t.id));
      tabsEl.appendChild(el);
    });

    const add = document.createElement('button');
    add.className = 'new-tab';
    add.type = 'button';
    add.title = 'New tab';
    add.textContent = '+';
    add.addEventListener('click', () => createTab());
    tabsEl.appendChild(add);
  }

  function createFrame(t){
    const wrap = document.createElement('div');
    wrap.className = 'frame-wrap';
    wrap.dataset.tabId = t.id;

    const iframe = document.createElement('iframe');

    // These permissions are important for normal sites:
    // forms, scripts, popups, downloads, media playback, fullscreen, etc.
    iframe.setAttribute(
      'sandbox',
      'allow-downloads allow-forms allow-modals allow-orientation-lock ' +
      'allow-pointer-lock allow-popups allow-popups-to-escape-sandbox ' +
      'allow-presentation allow-same-origin allow-scripts'
    );
    iframe.setAttribute('allow',
      'autoplay; fullscreen; picture-in-picture; encrypted-media; ' +
      'clipboard-read; clipboard-write; accelerometer; gyroscope'
    );
    iframe.setAttribute('allowfullscreen','');
    iframe.referrerPolicy = 'no-referrer';

    iframe.addEventListener('load', () => {
      if(activeTabId === t.id) setStatus('');
      // The proxy worker is responsible for rewriting navigation/media URLs.
      // We intentionally do not try to access iframe.location because it is cross-origin.
    });

    iframe.addEventListener('error', () => {
      if(activeTabId === t.id) showError(t.currentUrl, 'network error');
    });

    wrap.appendChild(iframe);
    viewport.appendChild(wrap);
    t.frame = iframe;
    t.wrap = wrap;
  }

  function showPlaceholder(t){
    t.wrap.innerHTML = `
      <div class="placeholder">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20z"/>
        </svg>
        <p>Enter a URL above to open it inside the sandbox.</p>
      </div>`;
    t.frame = null;
  }

  function showError(url, reason){
    const t = activeTab();
    if(!t) return;
    t.wrap.innerHTML = '';
    const msg = document.createElement('div');
    msg.className = 'blocked-msg';
    const p = document.createElement('p');
    p.innerHTML = '<span class="site-name"></span> could not be loaded through the proxy' +
      (reason ? ' (' + reason + ')' : '') + '.';
    p.querySelector('.site-name').textContent = siteLabel(url || '');
    const a = document.createElement('a');
    a.className = 'open-external';
    a.href = url || '#';
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.textContent = 'Open outside sandbox';
    msg.appendChild(p);
    msg.appendChild(a);
    t.wrap.appendChild(msg);
    t.frame = null;
    setStatus('error');
  }

  function createTab(initialUrl){
    const t = {
      id: nextTabId++,
      title: 'New Tab',
      currentUrl: '',
      history: [],
      historyIndex: -1,
      frame: null,
      wrap: null
    };
    tabs.push(t);
    createFrame(t);
    activateTab(t.id);
    if(initialUrl) loadUrl(initialUrl);
    return t;
  }

  function activateTab(id){
    const t = tabs.find(x => x.id === id);
    if(!t) return;
    activeTabId = id;

    tabs.forEach(x => {
      if(x.wrap) x.wrap.classList.toggle('active', x.id === id);
    });

    const current = t.currentUrl || '';
    urlInput.value = current;
    renderTabs();
    updateNavButtons();
    setStatus('');
  }

  function closeTab(id){
    const index = tabs.findIndex(t => t.id === id);
    if(index < 0) return;
    const wasActive = activeTabId === id;
    const t = tabs[index];
    if(t.wrap) t.wrap.remove();
    tabs.splice(index,1);

    if(!tabs.length){
      createTab();
      return;
    }
    if(wasActive){
      const next = tabs[Math.max(0,index-1)];
      activateTab(next.id);
    }else{
      renderTabs();
      updateNavButtons();
    }
  }

  function loadUrl(rawUrl, opts){
    opts = opts || {};
    const url = normalizeUrl(rawUrl);
    const t = activeTab();
    if(!t || !url) return false;

    if(PROXY_ORIGIN.includes('YOUR-SUBDOMAIN')){
      showError(url,'PROXY_ORIGIN is not configured');
      return false;
    }

    setStatus('loading');
    urlInput.value = url;
    t.currentUrl = url;
    t.title = siteLabel(url);

    if(!opts.fromHistory){
      t.history = t.history.slice(0,t.historyIndex + 1);
      t.history.push(url);
      t.historyIndex = t.history.length - 1;
    }

    if(!t.frame) createFrame(t);
    t.wrap.classList.add('active');

    t.frame.src = proxiedUrl(url);

    renderTabs();
    updateNavButtons();
    return true;
  }

  function navigateHistory(delta){
    const t = activeTab();
    if(!t) return;
    const next = t.historyIndex + delta;
    if(next < 0 || next >= t.history.length) return;
    t.historyIndex = next;
    loadUrl(t.history[next], {fromHistory:true});
  }

  urlForm.addEventListener('submit',e=>{
    e.preventDefault();
    const value = urlInput.value.trim();
    if(!value) return;
    if(!loadUrl(value)){
      const t = activeTab();
      if(t) showError(value,'invalid URL');
    }
  });

  backBtn.addEventListener('click',()=>navigateHistory(-1));
  forwardBtn.addEventListener('click',()=>navigateHistory(1));

  reloadBtn.addEventListener('click',()=>{
    const t = activeTab();
    if(t && t.currentUrl) loadUrl(t.currentUrl,{fromHistory:true});
  });

  // Ctrl/Cmd+L focuses the address bar. Ctrl/Cmd+T creates a tab.
  document.addEventListener('keydown',e=>{
    const mod = e.ctrlKey || e.metaKey;
    if(mod && e.key.toLowerCase() === 'l'){
      e.preventDefault();
      urlInput.focus();
      urlInput.select();
    }
    if(mod && e.key.toLowerCase() === 't'){
      e.preventDefault();
      createTab();
    }
    if(mod && e.key.toLowerCase() === 'w' && tabs.length > 1){
      e.preventDefault();
      closeTab(activeTabId);
    }
  });

  // Start with one empty tab.
  createTab();
})();
</script>
</body>
</html>
