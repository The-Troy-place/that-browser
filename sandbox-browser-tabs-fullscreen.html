<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sandbox Browser</title>
<style>
  :root {
    --chrome-bg: #23252b;
    --chrome-bg-2: #2c2f37;
    --border: #3a3d46;
    --text: #e8e9ec;
    --text-dim: #9a9da6;
    --accent: #4f8cff;
    --danger: #ff6b6b;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: transparent; }

  .sandbox-browser {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100vh;
    min-height: 520px;
    max-height: 100vh;
    background: var(--chrome-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 8px 30px rgba(0,0,0,0.25);
  }

  .tab-strip {
    display: flex;
    align-items: flex-end;
    gap: 4px;
    min-height: 38px;
    padding: 5px 8px 0;
    background: var(--chrome-bg);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }

  .tab {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 120px;
    max-width: 220px;
    height: 33px;
    padding: 0 10px;
    border: 1px solid var(--border);
    border-bottom: none;
    border-radius: 8px 8px 0 0;
    background: var(--chrome-bg-2);
    color: var(--text-dim);
    cursor: pointer;
    user-select: none;
  }

  .tab.active {
    background: #16171b;
    color: var(--text);
  }

  .tab-title {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 12px;
  }

  .tab-close {
    border: 0;
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    padding: 0;
  }

  .tab-close:hover { color: var(--text); }

  .new-tab {
    width: 30px;
    height: 30px;
    margin-bottom: 2px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--chrome-bg-2);
    color: var(--text);
    cursor: pointer;
    flex: 0 0 auto;
    font-size: 18px;
  }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    background: var(--chrome-bg);
    border-bottom: 1px solid var(--border);
  }

  .nav-btn {
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--chrome-bg-2);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text);
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.15s ease, opacity 0.15s ease;
  }
  .nav-btn:hover:not(:disabled) { background: #383c46; }
  .nav-btn:disabled { opacity: 0.35; cursor: default; }
  .nav-btn svg { width: 16px; height: 16px; }

  .url-form { flex: 1; display: flex; }

  .url-bar-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--chrome-bg-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0 12px;
    height: 32px;
  }
  .url-bar-wrap:focus-within { border-color: var(--accent); }

  .lock-icon { width: 13px; height: 13px; color: var(--text-dim); flex-shrink: 0; }

  .url-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 13px;
    min-width: 0;
  }
  .url-input::placeholder { color: var(--text-dim); }

  .go-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    display: flex;
    align-items: center;
    padding: 2px;
    flex-shrink: 0;
  }
  .go-btn:hover { color: var(--text); }

  .fullscreen-btn {
    width: 32px;
    height: 32px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--chrome-bg-2);
    color: var(--text);
    cursor: pointer;
    flex-shrink: 0;
  }

  .fullscreen-btn:hover { background: #383c46; }

  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--text-dim);
    flex-shrink: 0;
    transition: background 0.2s ease;
  }
  .status-dot.loading { background: var(--accent); animation: pulse 0.9s ease-in-out infinite; }
  .status-dot.error { background: var(--danger); }

  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

  .viewport { position: relative; flex: 1; background: #16171b; }
  .viewport iframe { width: 100%; height: 100%; border: none; background: #fff; display: block; }

  .placeholder, .blocked-msg {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px;
    color: var(--text-dim);
    gap: 10px;
  }
  .placeholder svg, .blocked-msg svg { width: 40px; height: 40px; opacity: 0.5; margin-bottom: 6px; }
  .placeholder p, .blocked-msg p { margin: 0; font-size: 13px; line-height: 1.5; max-width: 380px; }
  .blocked-msg .site-name { color: var(--text); font-weight: 600; }

  .open-external {
    margin-top: 8px;
    font-size: 12.5px;
    color: var(--accent);
    text-decoration: none;
    border: 1px solid var(--border);
    padding: 6px 14px;
    border-radius: 999px;
  }
  .open-external:hover { border-color: var(--accent); }

  .footer-note {
    padding: 6px 14px;
    font-size: 11px;
    color: var(--text-dim);
    background: var(--chrome-bg);
    border-top: 1px solid var(--border);
  }
  .footer-note code {
    background: var(--chrome-bg-2);
    padding: 1px 5px;
    border-radius: 4px;
  }
</style>
</head>
<body>

<div class="sandbox-browser" id="sandboxBrowser">
  <div class="tab-strip" id="tabStrip">
    <button class="new-tab" id="newTabBtn" title="New tab" type="button">+</button>
  </div>

  <div class="toolbar">
    <button class="nav-btn" id="backBtn" title="Back" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button class="nav-btn" id="forwardBtn" title="Forward" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>
    <button class="nav-btn" id="reloadBtn" title="Reload">

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
    </button>

    <form class="url-form" id="urlForm">
      <div class="url-bar-wrap">
        <svg class="lock-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input class="url-input" id="urlInput" type="text" placeholder="Enter a URL, e.g. example.com" autocomplete="off" spellcheck="false">
        <span class="status-dot" id="statusDot"></span>
        <button class="go-btn" type="submit" title="Go">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </div>
    </form>

    <button class="fullscreen-btn" id="fullscreenBtn" title="Fullscreen" type="button">⛶</button>
  </div>

  <div class="viewport" id="viewport">
    <div class="placeholder" id="placeholder">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20z"/></svg>
      <p>Sandboxed view, isolated from the rest of the page. Type a URL above to load a site inside it.</p>
    </div>
  </div>

  <div class="footer-note">Pages load through your proxy at <code id="proxyOriginLabel"></code>. The proxy should rewrite links/redirects to its own /proxy endpoint.</div>
</div>

<script>
(function () {
  // ---- SET THIS to your deployed Cloudflare Worker URL (no trailing slash) ----
  const PROXY_ORIGIN = 'https://sandbox-browser-proxy.the-troy-place.workers.dev';
  // -------------------------------------------------------------------------

  const browser = document.getElementById('sandboxBrowser');
  const tabStrip = document.getElementById('tabStrip');
  const newTabBtn = document.getElementById('newTabBtn');
  const viewport = document.getElementById('viewport');
  const urlForm = document.getElementById('urlForm');
  const urlInput = document.getElementById('urlInput');
  const backBtn = document.getElementById('backBtn');
  const forwardBtn = document.getElementById('forwardBtn');
  const reloadBtn = document.getElementById('reloadBtn');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  const statusDot = document.getElementById('statusDot');
  const proxyOriginLabel = document.getElementById('proxyOriginLabel');

  proxyOriginLabel.textContent = PROXY_ORIGIN;

  let tabs = [];
  let activeTabId = null;
  let nextTabId = 1;

  function normalizeUrl(raw) {
    let v = raw.trim();
    if (!v) return null;
    if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(v)) v = 'https://' + v;
    try {
      const u = new URL(v);
      if (!/^https?:$/i.test(u.protocol)) return null;
      return u.href;
    } catch (e) {
      return null;
    }
  }

  function siteLabel(url) {
    try { return new URL(url).hostname; } catch (e) { return url; }
  }

  function proxiedUrl(url) {
    return PROXY_ORIGIN + '/proxy?url=' + encodeURIComponent(url);
  }

  function setStatus(state) {
    statusDot.className = 'status-dot' + (state ? ' ' + state : '');
  }

  function activeTab() {
    return tabs.find(t => t.id === activeTabId) || null;
  }

  function updateNavButtons() {
    const tab = activeTab();
    if (!tab) {
      backBtn.disabled = true;
      forwardBtn.disabled = true;
      return;
    }
    backBtn.disabled = tab.historyIndex <= 0;
    forwardBtn.disabled = tab.historyIndex >= tab.history.length - 1;
  }

  function renderTabs() {
    tabStrip.querySelectorAll('.tab').forEach(el => el.remove());

    tabs.forEach(tab => {
      const el = document.createElement('div');
      el.className = 'tab' + (tab.id === activeTabId ? ' active' : '');
      el.dataset.id = tab.id;

      const title = document.createElement('span');
      title.className = 'tab-title';
      title.textContent = tab.title || 'New Tab';

      const close = document.createElement('button');
      close.className = 'tab-close';
      close.type = 'button';
      close.title = 'Close tab';
      close.textContent = '×';

      el.appendChild(title);
      el.appendChild(close);

      el.addEventListener('click', function () {
        switchTab(tab.id);
      });
      close.addEventListener('click', function (e) {
        e.stopPropagation();
        closeTab(tab.id);
      });

      tabStrip.insertBefore(el, newTabBtn);
    });
  }

  function updateTabTitle(tab, url) {
    tab.title = siteLabel(url) || 'New Tab';
    renderTabs();
  }

  function createTab(url, makeActive) {
    const id = nextTabId++;
    const normalized = url ? normalizeUrl(url) : null;

    const tab = {
      id,
      title: normalized ? siteLabel(normalized) : 'New Tab',
      history: normalized ? [normalized] : [],
      historyIndex: normalized ? 0 : -1,
      currentToken: 0
    };

    tabs.push(tab);
    renderTabs();

    if (makeActive !== false) {
      activeTabId = id;
      renderTabs();
      if (normalized) loadUrl(normalized, { fromHistory: true, tabId: id });
      else showPlaceholder();
    }

    return tab;
  }

  function closeTab(id) {
    const index = tabs.findIndex(t => t.id === id);
    if (index === -1) return;

    const wasActive = activeTabId === id;
    tabs.splice(index, 1);

    if (!tabs.length) {
      createTab(null, true);
      return;
    }

    if (wasActive) {
      const next = tabs[Math.max(0, index - 1)] || tabs[0];
      activeTabId = next.id;
      renderTabs();
      if (next.history[next.historyIndex]) {
        loadUrl(next.history[next.historyIndex], { fromHistory: true, tabId: next.id });
      } else {
        showPlaceholder();
      }
    } else {
      renderTabs();
    }
  }

  function switchTab(id) {
    const tab = tabs.find(t => t.id === id);
    if (!tab) return;

    activeTabId = id;
    renderTabs();

    if (tab.history[tab.historyIndex]) {
      loadUrl(tab.history[tab.historyIndex], { fromHistory: true, tabId: id });
    } else {
      showPlaceholder();
    }
  }

  function showPlaceholder() {
    viewport.innerHTML = '';
    const placeholder = document.createElement('div');
    placeholder.className = 'placeholder';
    placeholder.innerHTML =
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20z"/></svg>' +
      '<p>Enter a URL above to open a page in this tab.</p>';
    viewport.appendChild(placeholder);
    urlInput.value = '';
    setStatus('');
    updateNavButtons();
  }

  function showErrorMessage(url, reason) {
    viewport.innerHTML = '';
    const msg = document.createElement('div');
    msg.className = 'blocked-msg';

    const p = document.createElement('p');
    const site = document.createElement('span');
    site.className = 'site-name';
    site.textContent = siteLabel(url);
    p.appendChild(site);
    p.appendChild(document.createTextNode(' could not be loaded through the proxy.' + (reason ? ' (' + reason + ')' : '')));

    const a = document.createElement('a');
    a.className = 'open-external';
    a.href = url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.textContent = 'Open externally';

    msg.appendChild(p);
    msg.appendChild(a);
    viewport.appendChild(msg);
    setStatus('error');
  }

  function loadUrl(url, opts) {
    opts = opts || {};
    const tab = tabs.find(t => t.id === (opts.tabId || activeTabId));
    if (!tab) return;

    const token = ++tab.currentToken;
    setStatus('loading');
    urlInput.value = url;

    if (PROXY_ORIGIN.includes('YOUR-SUBDOMAIN')) {
      showErrorMessage(url, 'PROXY_ORIGIN is not configured yet');
      return;
    }

    if (tab.id !== activeTabId) return;

    viewport.innerHTML = '';
    const iframe = document.createElement('iframe');

    // Video/audio, fullscreen players, popups, forms and scripts are allowed.
    // The proxy remains responsible for rewriting cross-site navigation and redirects.
    iframe.setAttribute(
      'sandbox',
      'allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-presentation'
    );
    iframe.setAttribute(
      'allow',
      'autoplay; fullscreen; picture-in-picture; encrypted-media; accelerometer; gyroscope'
    );
    iframe.setAttribute('allowfullscreen', '');
    iframe.referrerPolicy = 'no-referrer';
    iframe.src = proxiedUrl(url);

    iframe.addEventListener('load', function () {
      if (token !== tab.currentToken || tab.id !== activeTabId) return;
      setStatus('');
    });

    iframe.addEventListener('error', function () {
      if (token !== tab.currentToken || tab.id !== activeTabId) return;
      showErrorMessage(url, 'network error');
    });

    viewport.appendChild(iframe);

    if (!opts.fromHistory) {
      tab.history = tab.history.slice(0, tab.historyIndex + 1);
      tab.history.push(url);
      tab.historyIndex = tab.history.length - 1;
    }

    updateTabTitle(tab, url);
    updateNavButtons();
  }

  function goFromInput() {
    const url = normalizeUrl(urlInput.value);
    if (!url) return;
    loadUrl(url);
  }

  urlForm.addEventListener('submit', function (e) {
    e.preventDefault();
    goFromInput();
  });

  backBtn.addEventListener('click', function () {
    const tab = activeTab();
    if (!tab || tab.historyIndex <= 0) return;
    tab.historyIndex--;
    loadUrl(tab.history[tab.historyIndex], { fromHistory: true });
  });

  forwardBtn.addEventListener('click', function () {
    const tab = activeTab();
    if (!tab || tab.historyIndex >= tab.history.length - 1) return;
    tab.historyIndex++;
    loadUrl(tab.history[tab.historyIndex], { fromHistory: true });
  });

  reloadBtn.addEventListener('click', function () {
    const tab = activeTab();
    if (tab && tab.history[tab.historyIndex]) {
      loadUrl(tab.history[tab.historyIndex], { fromHistory: true });
    }
  });

  newTabBtn.addEventListener('click', function () {
    createTab(null, true);
    urlInput.focus();
  });

  fullscreenBtn.addEventListener('click', async function () {
    try {
      if (document.fullscreenElement) {
        await document.exitFullscreen();
      } else {
        await browser.requestFullscreen();
      }
    } catch (e) {
      // Fullscreen can be denied by the embedding browser; the CSS layout
      // still fills the viewport.
    }
  });

  document.addEventListener('fullscreenchange', function () {
    fullscreenBtn.textContent = document.fullscreenElement ? '⤢' : '⛶';
    fullscreenBtn.title = document.fullscreenElement ? 'Exit fullscreen' : 'Fullscreen';
  });

  // Browsers normally require a user gesture for real fullscreen. The first
  // click/keypress inside the browser attempts it automatically.
  let autoFullscreenAttempted = false;
  browser.addEventListener('pointerdown', function () {
    if (autoFullscreenAttempted) return;
    autoFullscreenAttempted = true;
    if (!document.fullscreenElement) {
      browser.requestFullscreen().catch(function () {});
    }
  }, { once: true });

  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'l') {
      e.preventDefault();
      urlInput.focus();
      urlInput.select();
    }

    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 't') {
      e.preventDefault();
      createTab(null, true);
    }

    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'w') {
      e.preventDefault();
      closeTab(activeTabId);
    }
  });

  // Start with one empty tab.
  createTab(null, true);
})();
</script>

</body>
</html>
